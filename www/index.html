function renderNearbyMarkers(){
  if(!mapaInst)return;
  mapaInst.eachLayer(l=>{if(l instanceof L.Marker)mapaInst.removeLayer(l);});
  const CELL=0.004,items=[];
  nearbyPets.forEach(p=>{if(!p.latitude||!p.longitude)return;items.push({k:'pet',p});});
  lostPets.forEach(lp=>{if(!lp.latitude||!lp.longitude)return;items.push({k:'lost',p:lp});});
  const groups={};
  items.forEach(it=>{
    const key=Math.round(it.p.latitude/CELL)+':'+Math.round(it.p.longitude/CELL);
    (groups[key]=groups[key]||[]).push(it);
  });
  Object.values(groups).forEach(g=>{
    if(g.length>=4){
      const cy=g.reduce((s,x)=>s+x.p.latitude,0)/g.length;
      const cx=g.reduce((s,x)=>s+x.p.longitude,0)/g.length;
      const icon=L.divIcon({className:'',html:'<div class="map-cluster">'+g.length+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
      L.marker([cy,cx],{icon}).addTo(mapaInst).on('click',()=>mapaInst.setView([cy,cx],mapaInst.getZoom()+1));
      return;
    }
    g.forEach(it=>{
      if(it.k==='lost'){
        const p=it.p;
        const icon=L.divIcon({className:'',html:'<div class="map-marker lost">!</div>',iconSize:[36,36],iconAnchor:[18,18]});
        L.marker([p.latitude,p.longitude],{icon}).addTo(mapaInst)
          .bindPopup('<div style="text-align:center;min-width:120px"><b style="font-size:12px;color:#E76F51">'+(p.status==='lost'?'PERDIDO':'ENCONTRADO')+'</b><br><b>'+esc(p.pet_name)+'</b><br><span style="font-size:10px">'+esc(p.species)+' '+esc(p.breed)+'</span><br><button onclick="renderLostPets()" style="margin-top:4px;font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer">Ver detalhes</button></div>');
        return;
      }
      const p=it.p;
      const icon=L.divIcon({className:'',html:'<div class="map-marker pet"><img src="'+su(p.image||'')+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'&#128062;\'"></div>',iconSize:[40,40],iconAnchor:[20,20]});
      L.marker([p.latitude,p.longitude],{icon}).addTo(mapaInst)
        .bindPopup('<div style="text-align:center;min-width:120px"><img src="'+su(p.image||'')+'" style="width:60px;height:60px;border-radius:50%;object-fit:cover" onerror="this.style.display=\'none\'"><br><b style="font-size:12px">'+esc(p.name)+'</b><br><span style="font-size:10px;color:#666">'+esc(p.breed)+' '+fmtDist(p.distance)+'</span><br><button onclick="viewUserProfile('+p.user_id+')" style="margin-top:4px;font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer">Ver Tutor</button></div>');
    });
  });
}

async function exploreSearch(){
  const inp=document.getElementById('exploreSearchInput');
  const q=(inp?.value||'').trim().toLowerCase();
  const wrap=document.getElementById('exploreResults');
  if(!wrap)return;
  if(!q){wrap.style.display='none';return;}
  wrap.style.display='block';
  wrap.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  const lat=window._userLat||-2.5307,lng=window._userLng||-44.2829;
  if(!exploreAllPets.length)exploreAllPets=await api('/api/pets/all').catch(()=>[]);
  if(!exploreAllUsers.length)exploreAllUsers=await api('/api/nearby/users?lat='+lat+'&lng='+lng+'&radius=100').catch(()=>[]);
  if(!exploreAllLP.length)exploreAllLP=await api('/api/lostpets').catch(()=>[]);
  const svc=await api('/api/services').catch(()=>[]);
  const has=s=>s&&s.toLowerCase().includes(q);
  const fP=(exploreAllPets||[]).filter(p=>has(p.name)||has(p.breed)||has(p.species));
  const fU=(exploreAllUsers||[]).filter(u=>has(u.name));
  const fS=svc.filter(s=>has(s.title)||has(s.description)||has(s.provider_name));
  const fL=(exploreAllLP||[]).filter(x=>has(x.pet_name)||has(x.breed)||has(x.species));
  const rows=[];
  if(fS.length)rows.push('<div class="sr-group">Servicos ('+fS.length+')</div>'+fS.slice(0,5).map(s=>`<div class="sr-item" onclick="openBookingModal(${s.id},'${esc(s.title)}',${s.price})"><div class="sr-ico">${s.icon||'&#128137;'}</div><div><b>${esc(s.title)}</b><span class="small">${esc(s.provider_name||'')} &bull; R$ ${(s.price||0).toFixed(2)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(fP.length)rows.push('<div class="sr-group">Pets ('+fP.length+')</div>'+fP.slice(0,5).map(p=>`<div class="sr-item" onclick="openPetDetail(${p.id})"><div class="sr-ico pet"><img src="${su(p.image||'')}" onerror="this.style.display='none'" alt=""></div><div><b>${esc(p.name)}</b><span class="small">${petEmoji(p.species)} ${esc(p.breed||p.species)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(fU.length)rows.push('<div class="sr-group">Usuarios ('+fU.length+')</div>'+fU.slice(0,5).map(u=>`<div class="sr-item" onclick="viewUserProfile(${u.id})"><div class="sr-ico user">${esc((u.name||'?')[0])}</div><div><b>${esc(u.name)}</b><span class="small">${fmtDist(u.distance)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(fL.length)rows.push('<div class="sr-group">Pets reportados ('+fL.length+')</div>'+fL.slice(0,5).map(x=>`<div class="sr-item" onclick="renderLostPets()"><div class="sr-ico lost">&#128680;</div><div><b>${esc(x.pet_name)}</b><span class="small">${x.status==='lost'?'Perdido':'Encontrado'} &bull; reportado ${formatDate(x.created_at)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(!rows.length){wrap.innerHTML='<div class="explore-empty">Nenhum resultado para "'+esc(q)+'"</div>';return;}
  wrap.innerHTML='<div class="sr-head">Resultados para "<b>'+esc(q)+'</b>"</div>'+rows.join('');
}

function sendSticker(emoji) {
  if(!currentChatMatchId) return;
  sendWS({type:'chat_message',matchId:currentChatMatchId,text:emoji});
  api('/api/match/matches/'+currentChatMatchId+'/messages',{method:'POST',body:JSON.stringify({text:emoji})});
  const el=document.getElementById('chatMessages');
  if(el){el.innerHTML+=`<div class="chat-bubble sent" style="font-size:32px;padding:8px">${emoji}</div>`;el.scrollTop=el.scrollHeight;}
}

function sendLocation() {
  if(!navigator.geolocation) { alert('Geolocalizacao nao disponivel'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude, longitude} = pos.coords;
    const text = `[Localizacao] https://maps.google.com/?q=${latitude},${longitude}`;
    sendWS({type:'chat_message',matchId:currentChatMatchId,text});
    api('/api/match/matches/'+currentChatMatchId+'/messages',{method:'POST',body:JSON.stringify({text})});
    const el=document.getElementById('chatMessages');
    if(el){el.innerHTML+=`<div class="chat-bubble sent">&#128205; Localizacao compartilhada</div>`;el.scrollTop=el.scrollHeight;}
  }, () => alert('Nao foi possivel obter localizacao'));
}

async function openEventos(view){
  if(view)eventsFilter.view=view;
  currentEventId=null;
  screen.innerHTML=header('Eventos','','')+'<div class="content"><div class="loading" style="margin:36px auto"></div></div>';

async function loadEvents(){
  eventsLoading=true;
  const p=eventsFilter,qs=new URLSearchParams();
  if(p.cat)qs.set('category',p.cat);
  if(p.q)qs.set('q',p.q);
  if(p.view==='mine')qs.set('mine','1');
  else if(p.view==='past')qs.set('past','1');
  else qs.set('upcoming','1');
  try{const d=await api('/api/events?'+qs.toString());eventsData=d.events||[];}catch(e){eventsData=[];}
  eventsLoading=false;
}
function eventCard(ev){
  const img=ev.image?`<img src="${su(ev.image)}" onerror="this.style.display='none';this.parentNode.innerHTML='&#127881;'" class="ev-img">`:`<div class="ev-img" style="background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px">&#127881;</div>`;
  const today=new Date().toISOString().slice(0,10);
  const rem=today===ev.date&&ev.my_status==='going'?'<div class="rem-band">&#9203; Este evento e hoje!</div>':'';
  return `<div class="ev-card" onclick="openEventDetail(${ev.id})">
    <div class="ev-thumb">${img}</div>
    <div class="ev-body">
      <div class="ev-cat">${EV_CATS[ev.category]||ev.category||'Evento'}${ev.status!=='approved'?' &bull; analise':''}</div>
      <div class="ev-name">${esc(ev.name)}</div>
      <div class="ev-sub">&#128197; ${formatDateBR(ev.date)}${ev.time?' as '+esc(ev.time):''}</div>
      ${ev.location?`<div class="ev-sub">&#128205; ${esc(ev.location)}${ev.city?' &bull; '+esc(ev.city):''}</div>`:''}
      <div class="ev-foot"><span>${ev.organizer?esc(ev.organizer.name):''}</span><span class="ev-counts">&#128100; ${ev.count_participants||0} ${ev.saved_by_me?'&#128151;':''} ${ev.my_status==='going'?'&bull; voce vai':ev.my_status==='interested'?'&bull; tenho interesse':''}</span></div>
    </div></div>${rem}`;
}
function renderEventos(){
  const p=eventsFilter;
  const chips=Object.keys(EV_CATS).map(c=>`<button class="pl-chip ${p.cat===c?'on':''}" onclick="eventsFilter.cat='${p.cat===c?'':c}';loadEvents().then(renderEventos);">${EV_CATS[c]}</button>`).join('');

    </div>`;
  }else{
    btnHtml=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
      <button class="btn small-btn ${ev.my_status==='going'?'outline':''}" onclick="toggleEventParticipate(${ev.id},${ev.my_status==='going'?'null':"'going'"})">${ev.my_status==='going'?'&#10003; Voce vai':'Vou participar'}</button>
      ${ev.my_status!=='going'?`<button class="btn small-btn ${ev.my_status==='interested'?'outline':''}" onclick="toggleEventParticipate(${ev.id},${ev.my_status==='interested'?'null':"'interested'"})">${ev.my_status==='interested'?'&#128161; Interessado':'Tenho interesse'}</button>`:''}
      <button class="btn small-btn outline" onclick="toggleEventSave(${ev.id})">${ev.saved_by_me?'&#128151; Salvo':'Salvar'}</button>
      <button class="btn small-btn outline" onclick="shareEvent(${ev.id})">&#128257; Compartilhar (${ev.shares||0})</button>
      ${full}

/* ===== Notificacoes (E12) ===== */
function notifIcon(type){
  if(type==='follow')return'&#128100;';
  if(type==='message')return'&#128172;';
  if(type==='new_match'||type==='partnership_request'||type==='partnership_accepted')return'&#128153;';
  if(type==='adoption_request'||type==='adoption_approved')return'&#128062;';
  if(type==='event_participation')return'&#128197;';
  if(type==='payment')return'&#128176;';
  if(type==='moderation')return'&#128737;';
  if(type==='post_like'||type==='like')return'&#10084;';
  if(type==='comment'||type==='new_comment')return'&#128172;';
  return'&#128276;';
}
async function renderNotificacoes(){
  const d=await api('/api/notifications').catch(()=>({notifications:[],unreadCount:0}));
  notifications=d.notifications||[];unreadCount=d.unreadCount||0;
  const items=notifications.map(n=>`<div class="notif-row ${n.is_read?'':'unread'}" onclick="readNotifId(${n.id})">
    <div class="notif-ico">${notifIcon(n.type)}</div>
    <div class="notif-txt"><div>${esc(n.message)}</div><div class="small">${formatDate(n.created_at)}</div></div>
    ${n.is_read?'':'<span class="notif-dot"></span>'}
  </div>`).join('');
  screen.innerHTML=header('Notificacoes','',{icon:'&#8592;',click:'goBackScreen()'})+`<div class="content" style="padding-top:0">
    <div style="display:flex;gap:6px;margin:12px 0">
      <button class="btn small-btn" onclick="readNotifId(0)">&#10003; Marcar todas como lidas</button>
      <button class="btn small-btn outline" onclick="clearNotifs()">Limpar tudo</button>
    </div>
    ${notifications.length?items:`<div class="home-empty"><div style="font-size:34px">&#128276;</div><b style="display:block;margin:6px 0 2px;font-size:13px">Nenhuma notificacao</b><span class="small">Likes, comentarios, matches, parcerias, eventos, adocao e mais aparecerao aqui.</span></div>`}
  </div>`;
}
async function readNotifId(id){
  try{
    if(id){await api('/api/notifications/read/'+id,{method:'POST'});unreadCount=Math.max(0,unreadCount-1);}
    else {await api('/api/notifications/read',{method:'POST'});unreadCount=0;}
  }catch(e){}
  document.querySelector('.notif-dropdown')?.remove();
  await renderNotificacoes();
}
async function clearNotifs(){
  if(!confirm('Limpar todas as notificacoes?'))return;
  try{await api('/api/notifications',{method:'DELETE'});notifications=[];unreadCount=0;await renderNotificacoes();}catch(e){alert(e.message);}
}

      <div style="display:flex;gap:6px;margin-top:8px">

        <button class="btn small-btn outline small-btn-sm" onclick="deleteMyEvent(${e.id})">Excluir</button>
        <button class="btn small-btn outline small-btn-sm" onclick="openEventDetail(${e.id})">Abrir</button>
      </div>
    </div>`).join(''):'<div class="home-empty"><div style="font-size:34px">&#128197;</div><b style="display:block;margin:6px 0 2px;font-size:13px">Voce ainda nao criou eventos</b><span class="small">Eventos PRO aparecem aqui; eventos do plano gratuito entram em fila de moderacao.</span></div>'}
  </div>`;
}
async function editMyEvent(id){
  openNewEvent(id);
}
async function deleteMyEvent(id){
  if(!confirm('Excluir este evento?'))return;
  try{await api('/api/events/'+id,{method:'DELETE'});renderMyEvents();}catch(e){alert(e.message);}
}
async function renderMyAdoptions(){
  let ads=[];try{ads=await api('/api/adoption/mine');}catch(e){ads=[];}
  screen.innerHTML=header('Minha Adocao','',{icon:'&#8592;',click:'renderPerfil()'})+`<div class="content" style="padding-top:0">
    <button class="btn" style="width:100%;margin:12px 0" onclick="openNewAdoption()">+ Anunciar pet para adocao</button>
    ${ads.length?ads.map(a=>`<div class="ad-card" style="display:flex;gap:10px">
      <img src="${su(a.image||'')}" style="width:64px;height:64px;border-radius:10px;object-fit:cover" onerror="this.src='https://via.placeholder.com/64'">
      <div style="flex:1"><b style="font-size:13px">${esc(a.name)}</b><div class="small">${esc(a.species||'')} &bull; ${esc(a.breed||'')} &bull; ${esc(a.age||'')}</div>
        <span class="badge-${a.status==='available'?'free':a.status==='in_process'?'plus':'pro'}">${a.status==='available'?'Disponivel':a.status==='in_process'?'Em processo':'Adotado'}</span>
        ${a.count_requests?`<span class="small" style="margin-left:6px">${a.count_requests} pedido(s)</span>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button class="btn small-btn outline small-btn-sm" onclick="openAdoptionDetail(${a.id})">Abrir</button>
        ${a.count_requests?`<button class="btn small-btn small-btn-sm" onclick="openMyAdoptionRequests(${a.id})">Pedidos</button>`:''}
        <button class="btn small-btn outline small-btn-sm" onclick="openNewAdoption(${a.id})">Editar</button>
        <button class="btn small-btn outline small-btn-sm" onclick="deleteMyAdoption(${a.id})">Excluir</button>
      </div>
    </div>`).join(''):'<div class="home-empty"><div style="font-size:34px">&#128062;</div><b style="display:block;margin:6px 0 2px;font-size:13px">Nenhum animal anunciado</b><span class="small">Anuncie pets para adocao responsavel.</span></div>'}
  </div>`;
}
async function deleteMyAdoption(id){
  if(!confirm('Excluir este anuncio?'))return;
  try{await api('/api/adoption/'+id,{method:'DELETE'});renderMyAdoptions();}catch(e){alert(e.message);}
}

document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.addEventListener('click',e=>{
  if(!e.target.closest('.notif-btn')&&!e.target.closest('.notif-dropdown')){
    const nd=document.querySelector('.notif-dropdown');if(nd)nd.remove();
  }
  if(!e.target.closest('.post-menu')){
    document.querySelectorAll('.post-dropdown').forEach(d=>d.style.display='none');
  }
});

applyTheme();

if(token){
  api('/api/points/daily-login',{method:'POST'}).catch(()=>{});
  loadAll().then(()=>{checkOnboarding();connectWS();setInterval(()=>{if(ws&&ws.readyState===1)sendWS({type:'ping'});},25000);});
}else{
  renderAuth();
}
</script>
</body>
</html>
