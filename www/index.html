<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content:">
<title>ZUNNU — Super App Pet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#282722;--soft:#999;--line:#ECEAE5;--green:#245C4F;--green2:#347668;--greenSoft:#EAF5F0;--orange:#EE9C3C;--orangeSoft:#FFF0DB;--coral:#E76F51;--coralSoft:#FCE4DE;--pink:#D94F7A;--pinkSoft:#FCE8EF;--gold:#D4AF37;--goldSoft:#FFF9E6;--blue:#2B7BB9;--blueSoft:#E2F1FC;--pix:#32BCAD;--pixSoft:#E6F8F6}
[data-theme="dark"]{--bg:#1a1a2e;--card:#16213e;--ink:#e8e8e8;--soft:#a0a0b0;--line:#2a2a4a;--green:#347668;--green2:#245C4F;--greenSoft:#1a3a2e;--orange:#EE9C3C;--orangeSoft:#3a2a10;--coral:#E76F51;--coralSoft:#3a1a10;--pink:#D94F7A;--pinkSoft:#3a1a2a;--gold:#D4AF37;--goldSoft:#3a3010;--blue:#2B7BB9;--blueSoft:#1a2a3a;--pix:#32BCAD;--pixSoft:#1a3a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

.header{padding:12px 16px;background:var(--bg);position:sticky;top:0;z-index:10}
.header-row{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800}
.title{font-size:16px;font-weight:800;color:var(--ink)}
.header-actions{display:flex;gap:4px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;background:var(--card);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.plan-btn{border:0;background:linear-gradient(135deg,#FFE259,#FFA751);color:#5A3900;font-size:9px;font-weight:800;padding:5px 8px;border-radius:6px;cursor:pointer;letter-spacing:.3px}
.notif-btn{position:relative}.notif-badge{position:absolute;top:-1px;right:-1px;background:var(--coral);color:#fff;font-size:7px;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.content{padding:8px 16px 80px}
.section{margin:16px 0 8px}.section h2{margin:0;font-size:13px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.search-bar{display:flex;gap:6px;margin-bottom:12px}
.search-bar input{flex:1;border:none;background:var(--card);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink);outline:none;box-shadow:0 1px 3px rgba(0,0,0,.04)}

.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;display:inline-block}
.btn.outline{background:transparent;color:var(--green)}.btn.pink{background:var(--pink);border:none;color:#fff}.btn.gold{background:linear-gradient(135deg,#FFE259,#FFA751);border:none;color:#5A3900;font-weight:800}.btn.blue{background:var(--blue);border:none;color:#fff}.btn.pix{background:var(--pix);border-color:var(--pix);color:#fff}.btn.danger{background:var(--coral);border:none;color:#fff}
.small{font-size:11px;color:var(--soft)}.small-btn{padding:5px 8px;border-radius:6px;font-size:10px}

.badge-pro{background:var(--goldSoft);color:#916800;border:1px solid #F0C45C;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800}
.badge-plus{background:var(--blueSoft);color:var(--blue);border:1px solid #BCE0FD;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800}
.badge-free{background:#f0efec;color:var(--soft);padding:1px 5px;border-radius:4px;font-size:8px;font-weight:700}
.badge-verified{background:#E2F7EB;color:#1B663E;border:1px solid #A2E2DB;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800}

.ad-banner{background:var(--orangeSoft);border:none;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.ad-badge{font-size:7px;background:var(--orange);color:#fff;padding:2px 4px;border-radius:3px;font-weight:800}

.post{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.post-head{padding:10px 12px 0;gap:8px;display:flex;align-items:center}
.avatar{border-radius:50%;background:var(--greenSoft);font-size:16px;display:flex;align-items:center;justify-content:center;width:36px;height:36px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.post-user{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.post-meta{font-size:10px;color:var(--soft)}
.post-text{padding:6px 12px 8px;font-size:12px;line-height:1.5;color:var(--ink)}
.media{height:180px;background:var(--greenSoft)}.media img{width:100%;height:100%;object-fit:cover}
.post-actions{display:flex;gap:4px;padding:6px 12px;border-top:1px solid var(--line)}
.action{border:0;background:none;padding:4px 8px;cursor:pointer;font-size:11px;color:var(--soft);font-weight:600;border-radius:6px}.action:hover{background:var(--greenSoft)}

.post-menu{position:relative}.post-menu-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--soft);padding:4px}
.post-dropdown{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:15;min-width:110px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.post-dropdown button{display:block;width:100%;border:none;background:none;padding:6px 10px;font-size:11px;text-align:left;cursor:pointer;border-radius:4px}.post-dropdown button:hover{background:var(--greenSoft)}

.comments-section{padding:8px 12px;border-top:1px solid var(--line)}
.comment-item{display:flex;gap:6px;margin-bottom:6px}
.comment-item .avatar{width:24px;height:24px;font-size:10px}
.comment-text b{font-size:10px}.comment-text p{margin:0;font-size:11px;color:var(--soft)}
.comment-input{display:flex;gap:4px;margin-top:4px}
.comment-input input{flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;background:var(--bg);color:var(--ink)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.product-card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.product-card img{width:100%;height:100px;object-fit:cover}
.product-info{padding:8px;display:flex;flex-direction:column;flex:1}
.product-price{font-size:13px;font-weight:800;color:var(--green);margin:2px 0}

.service-card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.service-icon{width:40px;height:40px;border-radius:10px;background:var(--greenSoft);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

.match-deck{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.match-photo-wrap{position:relative;height:280px}.match-photo{width:100%;height:100%;object-fit:cover}
.match-overlay{position:absolute;bottom:0;inset-inline:0;padding:14px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);color:#fff}
.match-actions{display:flex;justify-content:center;gap:16px;padding:12px}
.action-round{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:transform .15s}.action-round:active{transform:scale(.9)}
.action-round.nope{color:var(--coral)}.action-round.like{color:var(--pink);background:var(--pinkSoft);border-color:var(--pinkSoft)}

.pet-card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.tutor-card{background:var(--card);border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.tutor-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.selfie-frame{width:140px;height:140px;border-radius:50%;border:3px dashed var(--green);margin:10px auto;position:relative;overflow:hidden;background:#333;display:flex;align-items:center;justify-content:center}
.selfie-preview{width:100%;height:100%;object-fit:cover}
.scan-line{position:absolute;width:100%;height:2px;background:var(--pix);top:0;animation:scan 2s infinite alternate}
@keyframes scan{0%{top:0%}100%{top:95%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skeleton{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:10px;height:50px;margin-bottom:8px}

.chat-window{display:flex;flex-direction:column;height:calc(100vh - 160px)}
.chat-messages{flex:1;overflow-y:auto;padding:8px 0}
.chat-bubble{max-width:75%;padding:8px 12px;border-radius:14px;margin-bottom:6px;font-size:12px;line-height:1.4}
.chat-bubble.sent{background:var(--green);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.chat-bubble.received{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-input{display:flex;gap:6px;padding:8px 0}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:12px;background:var(--card);color:var(--ink)}

.emoji-picker{display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.emoji-picker button{border:none;background:none;font-size:16px;cursor:pointer;padding:3px;border-radius:4px}.emoji-picker button:hover{background:var(--greenSoft)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.lightbox img{max-width:90%;max-height:90%;object-fit:contain}

.profile-view{background:var(--card);border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:56px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.nav-btn{border:0;background:none;flex:1;font-size:9px;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:color .2s}
.nav-btn.active{color:var(--green);font-weight:700}.nav-icon{font-size:16px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:430px;max-height:85vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px;animation:slideUp .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-title{font-size:14px;font-weight:700}.close{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px}
.field{margin-bottom:8px;text-align:left}.field label{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--soft)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);outline:none}
.plan-card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}

.loading{display:flex;justify-content:center;padding:30px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.onboarding-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200}
.onboarding-card{background:var(--card);border-radius:16px;padding:20px;text-align:center;max-width:320px;width:90%}

.notif-dropdown{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:15;width:240px;box-shadow:0 4px 12px rgba(0,0,0,.1);max-height:260px;overflow-y:auto}
.notif-item{padding:6px;border-radius:6px;font-size:11px;border-bottom:1px solid var(--line);cursor:pointer}.notif-item:last-child{border-bottom:none}.notif-item:hover{background:var(--greenSoft)}
.notif-item.unread{font-weight:700}

.stories-row{display:flex;gap:10px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none;-ms-overflow-style:none}
.stories-row::-webkit-scrollbar{display:none}
.story-circle{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}
.story-ring{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--pink),var(--orange));display:flex;align-items:center;justify-content:center}
.story-ring.viewed{background:var(--line)}
.story-ring.add-story{background:none;border:2px dashed var(--line)}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.story-ring .add-icon{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--green)}
.story-name{font-size:9px;color:var(--soft);max-width:56px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.story-viewer{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center}
.story-viewer-inner{width:100%;max-width:430px;height:100%;position:relative;display:flex;flex-direction:column}
.story-viewer-img{flex:1;object-fit:contain;background:#111}
.story-viewer-header{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:8px;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);z-index:1}
.story-viewer-header img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.story-viewer-header b{color:#fff;font-size:12px}
.story-viewer-header span{color:rgba(255,255,255,.6);font-size:10px}
.story-close{position:absolute;top:12px;right:12px;color:#fff;font-size:20px;cursor:pointer;z-index:2;background:rgba(0,0,0,.3);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.story-progress{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:8px 12px;z-index:2}
.story-progress-bar{flex:1;height:2px;background:rgba(255,255,255,.3);border-radius:1px;overflow:hidden}
.story-progress-bar .fill{height:100%;background:#fff;border-radius:1px;transition:width .1s linear}
.story-caption{position:absolute;bottom:0;left:0;right:0;padding:16px;color:#fff;font-size:13px;background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.story-nav{position:absolute;top:0;bottom:0;width:40%;cursor:pointer;z-index:1}.story-nav.prev{left:0}.story-nav.next{right:0}

.reel-card{position:relative;width:100%;height:calc(100vh - 56px);background:#000;scroll-snap-align:start;overflow:hidden}
.reel-video{width:100%;height:100%;object-fit:contain}
.reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:12px 14px 16px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);color:#fff}
.reel-overlay b{font-size:13px}.reel-overlay p{font-size:11px;margin:4px 0 0;opacity:.9;line-height:1.3}
.reel-music{display:flex;align-items:center;gap:4px;font-size:10px;opacity:.8;margin-top:4px}
.reel-actions{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:16px;align-items:center}
.reel-action-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#fff;font-size:10px}
.reel-action-btn .icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(4px)}
.reel-action-btn.liked .icon{background:var(--pink);color:#fff}
.modal-body{padding:0;max-height:50vh;overflow-y:auto}

.reels-container{scroll-snap-type:y mandatory;overflow-y:auto;height:calc(100vh - 56px)}

.map-container{width:100%;height:calc(100vh - 116px);position:relative}
#mapaView{width:100%;height:100%;z-index:1}
.map-pets-list{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:10px;z-index:2;max-height:35vh;overflow-y:auto;box-shadow:0 -2px 12px rgba(0,0,0,.1)}
.map-pet-card{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;transition:background .15s}
.map-pet-card:hover{background:var(--bg)}
.map-pet-card img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.map-toggle{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:6px}
.map-toggle button{padding:6px 10px;border-radius:20px;border:none;background:var(--card);font-size:11px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.map-toggle button.active{background:var(--green);color:#fff}

.social-user-header{text-align:center;padding:16px;background:var(--card);border-radius:16px;margin-bottom:12px}
.social-user-header .avatar-lg{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--green);margin:0 auto 8px;display:block}
.social-stats{display:flex;justify-content:space-around;background:var(--bg);border-radius:12px;padding:8px;margin:10px 0}
.social-stats div{text-align:center}.social-stats b{font-size:16px;display:block}

.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:12px;overflow:hidden}
.gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.gallery-album{margin-bottom:12px}
.gallery-album h4{font-size:12px;color:var(--soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}

.timeline{position:relative;padding-left:20px;margin:12px 0}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.timeline-item{position:relative;margin-bottom:16px;padding:10px;background:var(--card);border-radius:10px}
.timeline-item::before{content:'';position:absolute;left:-17px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.timeline-item .date{font-size:10px;color:var(--soft)}

.ai-match-card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;border-left:4px solid var(--green)}
.ai-match-score{font-size:20px;font-weight:800;color:var(--green);min-width:42px;text-align:center}
.ai-match-reasons{font-size:10px;color:var(--soft);margin-top:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.connection-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.connection-dot.online{background:#4CAF50}.connection-dot.offline{background:#f44336}
</style>
</head>
<body>
<div class="app">
  <div id="screen"></div>
  <div class="bottom-nav" id="bottomNav" style="display:none">
    <button class="nav-btn active" data-tab="inicio" aria-label="Inicio"><span class="nav-icon">&#8962;</span>Inicio</button>
    <button class="nav-btn" data-tab="mapa" aria-label="Mapa"><span class="nav-icon">&#128205;</span>Mapa</button>
    <button class="nav-btn" data-tab="reels" aria-label="Reels"><span class="nav-icon">&#127916;</span>Reels</button>
    <button class="nav-btn" data-tab="pets" aria-label="Pets"><span class="nav-icon">&#128062;</span>Pets</button>
    <button class="nav-btn" data-tab="perfil" aria-label="Perfil"><span class="nav-icon">&#128100;</span>Perfil</button>
  </div>
</div>
<script>
const API = '';
let token = localStorage.getItem('zunnu_token');
let tab = 'inicio';
let authMode = 'login';
let currentUser = null;
let posts = [];
let pets = [];
let matchDeck = [];
let currentMatchIdx = 0;
let activeProductCheckout = null;
let showComments = {};
let notifications = [];
let unreadCount = 0;
let viewingProfile = null;
let viewingPet = null;
let onboardingStep = 0;
let darkMode = localStorage.getItem('zunnu_dark') === '1';
let postPage = 1;
let postPages = 1;
let storiesData = [];
let myStory = null;
let reelsData = [];
let viewingStory = null;
let storyIdx = 0;
let storyTimer = null;

let wsReconnectTimer = null;

function connectWS() {
  if (!token) return;
  if (ws && ws.readyState <= 1) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws?token=' + token);
  ws.onopen = () => { console.log('[WS] Connected'); if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; } };
  ws.onclose = () => { console.log('[WS] Disconnected'); wsReconnectTimer = setTimeout(connectWS, 3000); };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    handleWSMessage(msg);
  };
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'connected': break;
    case 'new_post':
      if (tab === 'inicio' && msg.post && !posts.find(p => p.id === msg.post.id)) {
        posts.unshift(msg.post);
        if (tab === 'inicio') renderInicio();
      }
      break;
    case 'post_like':
      if (tab === 'inicio') {
        const p = posts.find(p => p.id === msg.postId);
        if (p) { p.likes = msg.likes; }
        renderInicio();
      }
      break;
    case 'new_comment':
      if (tab === 'inicio') {
        const p = posts.find(p => p.id === msg.postId);
        if (p) { p.comments_count = (p.comments_count || 0) + 1; }
        renderInicio();
      }
      break;
    case 'new_message':
      if (chatMatchId === msg.matchId) {
        loadChatMessages();
      } else {
        unreadCount++;
        showToast('Nova mensagem!');
      }
      break;
    case 'typing':
      if (chatMatchId === msg.matchId) {
        isTyping[msg.userId] = true;
        const el = document.getElementById('chatTyping');
        if (el) el.style.display = 'block';
        setTimeout(() => { isTyping[msg.userId] = false; if (el) el.style.display = 'none'; }, 2000);
      }
      break;
    case 'read':
      if (chatMatchId === msg.matchId) {
        const el = document.getElementById('chatLastSeen');
        if (el) el.textContent = 'Lida';
      }
      break;
    case 'new_match':
      showToast('Novo match! Voce e alguem se curtiram!');
      break;
    case 'new_follower':
      showToast('Alguem comecou a te seguir!');
      break;
    case 'new_story':
      showToast(msg.story?.user_name + ' postou um story!');
      break;
    case 'new_reel':
      showToast('Novo reel disponivel!');
      break;
    case 'notification':
      unreadCount++;
      showToast(msg.notification?.message || 'Nova notificacao');
      break;
    case 'pong': break;
  }
}

function showToast(text) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;font-weight:700;z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadeIn .3s';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

async function api(path,opts={}){
  const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  try{
    const r=await fetch(API+path,{...opts,headers:{...headers,...opts.headers}});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Erro na API');
    return data;
  }catch(e){throw e;}
}

function formatDate(dateStr){
  if(!dateStr)return'agora';
  const diff=(Date.now()-new Date(dateStr+'Z').getTime())/1000;
  if(diff<60)return'agora';
  if(diff<3600)return'ha '+Math.floor(diff/60)+' min';
  if(diff<86400)return'ha '+Math.floor(diff/3600)+'h';
  return'ha '+Math.floor(diff/86400)+' dias';
}
function calculateAge(birthDateString){
  if(!birthDateString)return 0;
  const today=new Date();const birth=new Date(birthDateString);
  let age=today.getFullYear()-birth.getFullYear();
  const m=today.getMonth()-birth.getMonth();
  if(m<0||(m===0&&today.getDate()<birth.getDate()))age--;
  return age;
}

async function handleAuth(){
  try{
    if(authMode==='register'){
      const name=document.getElementById('regName')?.value.trim();
      const birth=document.getElementById('regBirth')?.value;
      const email=document.getElementById('authEmail')?.value.trim();
      const pass=document.getElementById('authPass')?.value;
      if(!name){alert('Informe seu nome.');return;}
      if(!birth){alert('Informe sua data de nascimento.');return;}
      if(!email){alert('Informe seu email.');return;}
      if(!pass||pass.length<6){alert('Senha deve ter minimo 6 caracteres.');return;}
      const age=calculateAge(birth);
      if(age<18){alert('Cadastro restrito a maiores de 18 anos.');return;}
      const data=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name,email,password:pass,birthDate:birth})});
      token=data.token;localStorage.setItem('zunnu_token',token);
      currentUser=data.user;currentUser.plan='free';currentUser.stats={pets:0,posts:0,matches:0};
    }else{
      const email=document.getElementById('authEmail')?.value.trim();
      const pass=document.getElementById('authPass')?.value;
      if(!email||!pass){alert('Preencha email e senha.');return;}
      const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});
      token=data.token;localStorage.setItem('zunnu_token',token);
      await loadProfile();
    }
    loadAll();
  }catch(e){alert('Erro: '+e.message);}
}

async function toggleNotifs(){
  const el=document.getElementById('notifDropdown');
  if(el){el.remove();return;}
  const existing=document.querySelector('.notif-dropdown');
  if(existing){existing.remove();return;}
  const data=await api('/api/notifications').catch(()=>({notifications:[],unreadCount:0}));
  notifications=data.notifications||[];unreadCount=data.unreadCount||0;
  const btn=document.querySelector('.notif-btn');
  if(!btn)return;
  const div=document.createElement('div');div.className='notif-dropdown';
  div.innerHTML=notifications.length===0?'<div style="padding:12px;text-align:center;font-size:11px;color:var(--soft)">Sem notificacoes</div>':
    notifications.slice(0,10).map(n=>`<div class="notif-item ${n.is_read?'':'unread'}" onclick="readNotif(${n.id})">${esc(n.message)}<br><span class="small">${formatDate(n.created_at)}</span></div>`).join('');
  btn.appendChild(div);
}

async function readNotif(id){
  try{await api('/api/notifications/read/'+id,{method:'POST'});unreadCount=Math.max(0,unreadCount-1);toggleNotifs();}catch(e){}
}

    const r=await api('/api/payments/confirm/'+activeProductCheckout?.id,{method:'POST'});

      closeModal();
      await loadProfile();
      alert(r.message||'Pagamento confirmado! Plano ativado!');
      render();
    }else{
      alert(r.message||'Pagamento ainda pendente. Verifique se o Pix foi enviado e tente novamente.');
    }
  }catch(e){alert(e.message||'Erro ao confirmar pagamento.');}
}

function copyPixCode(){
  const el=document.getElementById('pixCopyCode');
  const code=el?.textContent||'';
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(()=>alert('Codigo Pix copiado!')).catch(()=>fallbackCopy(code));}
  else{fallbackCopy(code);}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('Codigo Pix copiado!');}catch(e){alert('Nao foi possivel copiar. Copie manualmente.');}
  document.body.removeChild(ta);
}

async function startPayment(plan){
  try{
    const data=await api('/api/payments/create-pix',{method:'POST',body:JSON.stringify({plan})});
    activeProductCheckout={id:data.txid,title:'Plano '+(data.plan||plan).toUpperCase(),price:data.amount,pixQrCode:data.pixQrCode,pixCopyPaste:data.pixCopyPaste,ticketUrl:data.ticketUrl};
    openModal('checkout');
  }catch(e){
    alert('Pagamento simulado! Plano '+plan+' ativado.');
    if(currentUser)currentUser.plan=plan;closeModal();render();
  }
}

let currentChatMatchId=null;

async function openChat(matchId,partnerName,partnerAvatar){
  currentChatMatchId=matchId;
  chatMatchId=matchId;
  const root=document.getElementById('modal-root');
  if(!root)return;
  root.innerHTML=`<div class="modal-bg" style="height:100%;align-items:stretch" onclick="if(event.target===this)closeModal()"><div class="modal" style="border-radius:0;max-height:100%;height:100%;display:flex;flex-direction:column">
    <div class="modal-head"><div style="display:flex;align-items:center;gap:8px"><button class="close" onclick="closeModal()">&#8592;</button><b>${esc(partnerName)}</b></div></div>
    <div class="chat-window"><div class="chat-messages" id="chatMessages"></div>
    <div id="chatTyping" style="display:none;font-size:10px;color:var(--soft);padding:2px 8px">Digitando...</div>
    <div class="chat-input"><input id="chatInput" placeholder="Mensagem..." onkeydown="if(event.key==='Enter')sendChatMsg();if(event.key)sendWS({type:'typing',matchId:${matchId}})"><button class="btn small-btn" onclick="sendChatMsg()">Enviar</button></div>
  </div></div>`;
  document.body.appendChild(root);
  await loadChatMessages();
}

async function loadChatMessages(){
  if(!currentChatMatchId)return;
  const el=document.getElementById('chatMessages');if(!el)return;
  try{
    const messages=await api('/api/match/matches/'+currentChatMatchId+'/messages');
    el.innerHTML=messages.map(m=>`<div class="chat-bubble ${m.sender_id===currentUser?.id?'sent':'received'}">${esc(m.text)}<div style="font-size:9px;margin-top:4px;opacity:.7">${formatDate(m.created_at)}</div></div>`).join('');
    el.scrollTop=el.scrollHeight;
  }catch(e){}
}

async function sendChatMsg(){
  const input=document.getElementById('chatInput');
  const text=input?.value.trim();if(!text||!currentChatMatchId)return;
  input.value='';
  const el=document.getElementById('chatMessages');
  if(el){el.innerHTML+=`<div class="chat-bubble sent">${esc(text)}<div style="font-size:9px;margin-top:4px;opacity:.7">agora</div></div>`;el.scrollTop=el.scrollHeight;}
  sendWS({type:'chat_message',matchId:currentChatMatchId,text});
  try{await api('/api/match/matches/'+currentChatMatchId+'/messages',{method:'POST',body:JSON.stringify({text})});}catch(e){}
}
function viewStory(userId){
  const group=storiesData.find(s=>s.user_id===userId);
  if(!group||!group.stories.length)return;
  viewingStory=group;
  storyIdx=0;
  showStorySlide();
}
function showStorySlide(){
  if(!viewingStory||storyIdx>=viewingStory.stories.length){closeStory();return;}
  const s=viewingStory.stories[storyIdx];
  const existing=document.getElementById('storyViewer');if(existing)existing.remove();
  api('/api/stories/'+s.id+'/view',{method:'POST'}).catch(()=>{});
  const el=document.createElement('div');el.className='story-viewer';el.id='storyViewer';
  el.innerHTML=`<div class="story-viewer-inner">
    <div class="story-progress">${viewingStory.stories.map((_,i)=>`<div class="story-progress-bar"><div class="fill" id="sp-${i}" style="width:${i<storyIdx?'100%':'0%'}"></div></div>`).join('')}</div>
    <div class="story-viewer-header">
      <img src="${viewingStory.user_avatar||''}" onerror="this.style.display='none'" alt="">
      <b>${esc(viewingStory.user_name)}</b>
      <span>${formatDate(s.created_at)}</span>
    </div>
    <div class="story-close" onclick="closeStory()">&#10005;</div>
    <img class="story-viewer-img" src="${s.image_url}" alt="">
    ${s.caption?`<div class="story-caption">${esc(s.caption)}</div>`:''}
    <div class="story-nav prev" onclick="prevStorySlide()"></div>
    <div class="story-nav next" onclick="nextStorySlide()"></div>
  </div>`;
  document.body.appendChild(el);
  let w=0;const bar=document.getElementById('sp-'+storyIdx);
  storyTimer=setInterval(()=>{w+=2;if(bar)bar.style.width=w+'%';if(w>=100){clearInterval(storyTimer);nextStorySlide();}},100);
}
function nextStorySlide(){clearInterval(storyTimer);storyIdx++;showStorySlide();}
function prevStorySlide(){clearInterval(storyTimer);storyIdx=Math.max(0,storyIdx-1);showStorySlide();}
function closeStory(){clearInterval(storyTimer);viewingStory=null;const el=document.getElementById('storyViewer');if(el)el.remove();}

let mapaInst=null;
let nearbyPets=[];
let mapaFilter='all';
function renderMapa(){
  screen.innerHTML=header('Mapa','',{icon:'AI',click:"renderAiSuggestions()"})+`
    <div class="map-container">
      <div class="map-toggle">
        <button class="${mapaFilter==='all'?'active':''}" onclick="mapaFilter='all';loadNearbyPets()">Todos</button>
        <button class="${mapaFilter==='Cachorro'?'active':''}" onclick="mapaFilter='Cachorro';loadNearbyPets()">&#128054; Dogs</button>
        <button class="${mapaFilter==='Gato'?'active':''}" onclick="mapaFilter='Gato';loadNearbyPets()">&#128049; Cats</button>
      </div>
      <div id="mapaView"></div>
      <div class="map-pets-list" id="mapPetsList"><p style="text-align:center;color:var(--soft);padding:12px">Carregando...</p></div>
    </div>`;
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      window._userLat=pos.coords.latitude;window._userLng=pos.coords.longitude;
      initMap(pos.coords.latitude,pos.coords.longitude);
      loadNearbyPets();
    },()=>{initMap(-2.5307,-44.2829);loadNearbyPets();});
  }else{initMap(-2.5307,-44.2829);loadNearbyPets();}
}
function initMap(lat,lng){
  if(mapaInst){mapaInst.remove();mapaInst=null;}
  mapaInst=L.map('mapaView',{zoomControl:false}).setView([lat,lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(mapaInst);
  L.control.zoom({position:'topright'}).addTo(mapaInst);
  L.circleMarker([lat,lng],{radius:8,fillColor:'#4CAF50',fillOpacity:1,color:'#fff',weight:2}).addTo(mapaInst)
    .bindPopup('Voce esta aqui');
  setTimeout(()=>mapaInst.invalidateSize(),200);
}
async function loadNearbyPets(){
  const lat=window._userLat||-2.5307,lng=window._userLng||-44.2829;
  try{
    let url='/api/nearby/pets?lat='+lat+'&lng='+lng+'&radius=20';
    if(mapaFilter!=='all')url+='&species='+encodeURIComponent(mapaFilter);
    nearbyPets=await api(url);
    renderNearbyList();
    renderNearbyMarkers();
  }catch(e){console.error(e);}
}
function renderNearbyMarkers(){
  if(!mapaInst)return;
  mapaInst.eachLayer(l=>{if(l instanceof L.CircleMarker&&l.getPopup()?.getContent()!=='Voce esta aqui')mapaInst.removeLayer(l);});
  nearbyPets.forEach(p=>{
    if(!p.latitude||!p.longitude)return;
    const icon=L.divIcon({className:'',html:`<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);background:#fff"><img src="${p.image||''}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.parentNode.innerHTML='&#128062;'"></div>`,iconSize:[36,36],iconAnchor:[18,18]});
    L.marker([p.latitude,p.longitude],{icon}).addTo(mapaInst)
      .bindPopup(`<div style="text-align:center;min-width:120px"><img src="${p.image||''}" style="width:60px;height:60px;border-radius:50%;object-fit:cover" onerror="this.style.display='none'"><br><b style="font-size:12px">${esc(p.name)}</b><br><span style="font-size:10px;color:#666">${esc(p.breed)} ${p.distance}km</span><br><button onclick="viewUserProfile(${p.user_id})" style="margin-top:4px;font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer">Ver Tutor</button></div>`);
  });
}
function renderNearbyList(){
  const el=document.getElementById('mapPetsList');if(!el)return;
  if(nearbyPets.length===0){el.innerHTML='<p style="text-align:center;color:var(--soft);padding:12px">Nenhum pet encontrado nearby</p>';return;}
  el.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--soft);margin-bottom:6px;padding:0 4px">${nearbyPets.length} pets por perto</div>`+
    nearbyPets.map(p=>`<div class="map-pet-card" onclick="viewUserProfile(${p.user_id})">
      <img src="${p.image||''}" onerror="this.src='https://via.placeholder.com/40'" alt="">
      <div style="flex:1"><b style="font-size:12px">${esc(p.name)}</b><div style="font-size:10px;color:var(--soft)">${esc(p.breed)} &bull; ${p.distance}km</div></div>
      <div style="font-size:10px;color:var(--green);font-weight:600">${esc(p.zodiac||'')}</div>
    </div>`).join('');
}

function renderOnboarding(){
  const steps=[
    {title:'Bem-vindo ao ZUNNU!',text:'O super app para tutores de pets. Descubra a comunidade!',icon:'&#128062;'},
    {title:'Feed & Comunidade',text:'Compartilhe fotos, historias e conecte-se com outros tutores.',icon:'&#128247;'},
    {title:'Match & Chat',text:'Encontre amigos para seu pet e converse pelo chat!',icon:'&#128148;'},
    {title:'Loja & Servicos',text:'Compre produtos e contrate servicos profissionais para seu pet.',icon:'&#128722;'}
  ];
  const s=steps[onboardingStep];
  if(!s)return;
  const overlay=document.createElement('div');overlay.className='onboarding-overlay';overlay.id='onboarding';
  overlay.innerHTML=`<div class="onboarding-card"><div style="font-size:48px;margin-bottom:12px">${s.icon}</div><h3 style="margin:0 0 8px">${s.title}</h3><p class="small">${s.text}</p><div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
    ${onboardingStep>0?'<button class="btn small-btn outline" onclick="prevOnboarding()">Voltar</button>':''}
    <button class="btn" onclick="nextOnboarding()">${onboardingStep<steps.length-1?'Proximo':'Comecar!'}</button>
  </div><div style="margin-top:8px;font-size:10px;color:var(--soft)">${onboardingStep+1}/${steps.length}</div></div>`;
  document.body.appendChild(overlay);
}

function nextOnboarding(){onboardingStep++;document.getElementById('onboarding')?.remove();if(onboardingStep>=4){closeOnboarding();return;}renderOnboarding();}
function prevOnboarding(){onboardingStep--;document.getElementById('onboarding')?.remove();renderOnboarding();}
function closeOnboarding(){document.getElementById('onboarding')?.remove();localStorage.setItem('zunnu_onboarded','1');}

async function checkOnboarding(){
  if(!localStorage.getItem('zunnu_onboarded')&&currentUser){
    try{const postsData=await api('/api/posts?limit=5');if((postsData.posts||[]).length<3){onboardingStep=0;renderOnboarding();}}catch(e){}
  }
}

document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.addEventListener('click',e=>{
  if(!e.target.closest('.notif-btn')&&!e.target.closest('.notif-dropdown')){
    const nd=document.querySelector('.notif-dropdown');if(nd)nd.remove();
  }
  if(!e.target.closest('.post-menu')){
    document.querySelectorAll('.post-dropdown').forEach(d=>d.style.display='none');
  }
});

applyTheme();

if(token){
  loadAll().then(()=>{checkOnboarding();connectWS();setInterval(()=>{if(ws&&ws.readyState===1)sendWS({type:'ping'});},25000);});
}else{
  renderAuth();
}
</script>
</body>
</html>
