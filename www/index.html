<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' https: blob:; font-src 'self' data: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>ZUNNU — Super App Pet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#282722;--soft:#999;--line:#ECEAE5;--green:#245C4F;--green2:#347668;--greenSoft:#EAF5F0;--orange:#EE9C3C;--orangeSoft:#FFF0DB;--coral:#E76F51;--coralSoft:#FCE4DE;--pink:#D94F7A;--pinkSoft:#FCE8EF;--gold:#D4AF37;--goldSoft:#FFF9E6;--blue:#2B7BB9;--blueSoft:#E2F1FC;--pix:#32BCAD;--pixSoft:#E6F8F6}
[data-theme="dark"]{--bg:#1a1a2e;--card:#16213e;--ink:#e8e8e8;--soft:#a0a0b0;--line:#2a2a4a;--green:#347668;--green2:#245C4F;--greenSoft:#1a3a2e;--orange:#EE9C3C;--orangeSoft:#3a2a10;--coral:#E76F51;--coralSoft:#3a1a10;--pink:#D94F7A;--pinkSoft:#3a1a2a;--gold:#D4AF37;--goldSoft:#3a3010;--blue:#2B7BB9;--blueSoft:#1a2a3a;--pix:#32BCAD;--pixSoft:#1a3a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

.header{padding:12px 16px;background:var(--bg);position:sticky;top:0;z-index:10}
.header-row{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800}
.title{font-size:16px;font-weight:800;color:var(--ink)}
.header-actions{display:flex;gap:4px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;background:var(--card);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.plan-btn{border:0;background:linear-gradient(135deg,#FFE259,#FFA751);color:#5A3900;font-size:9px;font-weight:800;padding:5px 8px;border-radius:6px;cursor:pointer;letter-spacing:.3px}
.notif-btn{position:relative}.notif-badge{position:absolute;top:-1px;right:-1px;background:var(--coral);color:#fff;font-size:7px;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.content{padding:8px 16px 80px}
.section{margin:16px 0 8px}.section h2{margin:0;font-size:13px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.search-bar{display:flex;gap:6px;margin-bottom:12px}
.search-bar input{flex:1;border:none;background:var(--card);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink);outline:none;box-shadow:0 1px 3px rgba(0,0,0,.04)}

.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;display:inline-block}
.btn.outline{background:transparent;color:var(--green)}.btn.pink{background:var(--pink);border:none;color:#fff}.btn.gold{background:linear-gradient(135deg,#FFE259,#FFA751);border:none;color:#5A3900;font-weight:800}.btn.blue{background:var(--blue);border:none;color:#fff}.btn.pix{background:var(--pix);border-color:var(--pix);color:#fff}.btn.danger{background:var(--coral);border:none;color:#fff}
.small{font-size:11px;color:var(--soft)}.small-btn{padding:5px 8px;border-radius:6px;font-size:10px}

.badge-pro{background:var(--goldSoft);color:#916800;border:1px solid #F0C45C;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800}
.badge-plus{background:var(--blueSoft);color:var(--blue);border:1px solid #BCE0FD;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800}
.badge-free{background:#f0efec;color:var(--soft);padding:1px 5px;border-radius:4px;font-size:8px;font-weight:700}
.badge-verified{background:#E2F7EB;color:#1B663E;border:1px solid #A2E2DB;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800}

.ad-banner{background:var(--orangeSoft);border:none;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.ad-badge{font-size:7px;background:var(--orange);color:#fff;padding:2px 4px;border-radius:3px;font-weight:800}

.post{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.post-head{padding:10px 12px 0;gap:8px;display:flex;align-items:center}
.avatar{border-radius:50%;background:var(--greenSoft);font-size:16px;display:flex;align-items:center;justify-content:center;width:36px;height:36px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.post-user{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.post-meta{font-size:10px;color:var(--soft)}
.post-text{padding:6px 12px 8px;font-size:12px;line-height:1.5;color:var(--ink)}
.media{height:180px;background:var(--greenSoft)}.media img{width:100%;height:100%;object-fit:cover}
.post-actions{display:flex;gap:4px;padding:6px 12px;border-top:1px solid var(--line)}
.action{border:0;background:none;padding:4px 8px;cursor:pointer;font-size:11px;color:var(--soft);font-weight:600;border-radius:6px}.action:hover{background:var(--greenSoft)}

.post-menu{position:relative}.post-menu-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--soft);padding:4px}
.post-dropdown{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:15;min-width:110px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.post-dropdown button{display:block;width:100%;border:none;background:none;padding:6px 10px;font-size:11px;text-align:left;cursor:pointer;border-radius:4px}.post-dropdown button:hover{background:var(--greenSoft)}

.comments-section{padding:8px 12px;border-top:1px solid var(--line)}
.comment-item{display:flex;gap:6px;margin-bottom:6px}
.comment-item .avatar{width:24px;height:24px;font-size:10px}
.comment-text b{font-size:10px}.comment-text p{margin:0;font-size:11px;color:var(--soft)}
.comment-input{display:flex;gap:4px;margin-top:4px}
.comment-input input{flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;background:var(--bg);color:var(--ink)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.product-card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.product-card img{width:100%;height:100px;object-fit:cover}
.product-info{padding:8px;display:flex;flex-direction:column;flex:1}
.product-price{font-size:13px;font-weight:800;color:var(--green);margin:2px 0}

.service-card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.service-icon{width:40px;height:40px;border-radius:10px;background:var(--greenSoft);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

.match-deck{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.match-photo-wrap{position:relative;height:280px}.match-photo{width:100%;height:100%;object-fit:cover}
.match-overlay{position:absolute;bottom:0;inset-inline:0;padding:14px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);color:#fff}
.match-actions{display:flex;justify-content:center;gap:16px;padding:12px}
.action-round{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:transform .15s}.action-round:active{transform:scale(.9)}
.action-round.nope{color:var(--coral)}.action-round.like{color:var(--pink);background:var(--pinkSoft);border-color:var(--pinkSoft)}

.pet-card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);animation:fadeIn .3s ease}
.tutor-card{background:var(--card);border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.tutor-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.selfie-frame{width:140px;height:140px;border-radius:50%;border:3px dashed var(--green);margin:10px auto;position:relative;overflow:hidden;background:#333;display:flex;align-items:center;justify-content:center}
.selfie-preview{width:100%;height:100%;object-fit:cover}
.scan-line{position:absolute;width:100%;height:2px;background:var(--pix);top:0;animation:scan 2s infinite alternate}
@keyframes scan{0%{top:0%}100%{top:95%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skeleton{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:10px;height:50px;margin-bottom:8px}

.chat-window{display:flex;flex-direction:column;height:calc(100vh - 160px)}
.chat-messages{flex:1;overflow-y:auto;padding:8px 0}
.chat-bubble{max-width:75%;padding:8px 12px;border-radius:14px;margin-bottom:6px;font-size:12px;line-height:1.4}
.chat-bubble.sent{background:var(--green);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.chat-bubble.received{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-input{display:flex;gap:6px;padding:8px 0}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:12px;background:var(--card);color:var(--ink)}

.emoji-picker{display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.emoji-picker button{border:none;background:none;font-size:16px;cursor:pointer;padding:3px;border-radius:4px}.emoji-picker button:hover{background:var(--greenSoft)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.lightbox img{max-width:90%;max-height:90%;object-fit:contain}

.profile-view{background:var(--card);border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:56px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.nav-btn{border:0;background:none;flex:1;font-size:9px;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:color .2s}
.nav-btn.active{color:var(--green);font-weight:700}.nav-icon{font-size:16px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:430px;max-height:85vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px;animation:slideUp .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-title{font-size:14px;font-weight:700}.close{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px}
.field{margin-bottom:8px;text-align:left}.field label{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--soft)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);outline:none}
.plan-card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}

.loading{display:flex;justify-content:center;padding:30px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.onboarding-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200}
.onboarding-card{background:var(--card);border-radius:16px;padding:20px;text-align:center;max-width:320px;width:90%}

.notif-dropdown{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:15;width:240px;box-shadow:0 4px 12px rgba(0,0,0,.1);max-height:260px;overflow-y:auto}
.notif-item{padding:6px;border-radius:6px;font-size:11px;border-bottom:1px solid var(--line);cursor:pointer}.notif-item:last-child{border-bottom:none}.notif-item:hover{background:var(--greenSoft)}
.notif-item.unread{font-weight:700}

.stories-row{display:flex;gap:10px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none;-ms-overflow-style:none}
.stories-row::-webkit-scrollbar{display:none}
.story-circle{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}
.story-ring{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--pink),var(--orange));display:flex;align-items:center;justify-content:center}
.story-ring.viewed{background:var(--line)}
.story-ring.add-story{background:none;border:2px dashed var(--line)}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.story-ring .add-icon{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--green)}
.story-name{font-size:9px;color:var(--soft);max-width:56px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.story-viewer{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center}
.story-viewer-inner{width:100%;max-width:430px;height:100%;position:relative;display:flex;flex-direction:column}
.story-viewer-img{flex:1;object-fit:contain;background:#111}
.story-viewer-header{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:8px;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);z-index:1}
.story-viewer-header img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.story-viewer-header b{color:#fff;font-size:12px}
.story-viewer-header span{color:rgba(255,255,255,.6);font-size:10px}
.story-close{position:absolute;top:12px;right:12px;color:#fff;font-size:20px;cursor:pointer;z-index:2;background:rgba(0,0,0,.3);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.story-progress{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:8px 12px;z-index:2}
.story-progress-bar{flex:1;height:2px;background:rgba(255,255,255,.3);border-radius:1px;overflow:hidden}
.story-progress-bar .fill{height:100%;background:#fff;border-radius:1px;transition:width .1s linear}
.story-caption{position:absolute;bottom:0;left:0;right:0;padding:16px;color:#fff;font-size:13px;background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.story-nav{position:absolute;top:0;bottom:0;width:40%;cursor:pointer;z-index:1}.story-nav.prev{left:0}.story-nav.next{right:0}

.reel-card{position:relative;width:100%;height:calc(100vh - 56px);background:#000;scroll-snap-align:start;overflow:hidden}
.reel-video{width:100%;height:100%;object-fit:contain}
.reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:12px 14px 16px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);color:#fff}
.reel-overlay b{font-size:13px}.reel-overlay p{font-size:11px;margin:4px 0 0;opacity:.9;line-height:1.3}
.reel-music{display:flex;align-items:center;gap:4px;font-size:10px;opacity:.8;margin-top:4px}
.reel-actions{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:16px;align-items:center}
.reel-action-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#fff;font-size:10px}
.reel-action-btn .icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(4px)}
.reel-action-btn.liked .icon{background:var(--pink);color:#fff}
.modal-body{padding:0;max-height:50vh;overflow-y:auto}

.reels-container{scroll-snap-type:y mandatory;overflow-y:auto;height:calc(100vh - 56px)}

.map-container{width:100%;height:calc(100vh - 116px);position:relative}
#mapaView{width:100%;height:100%;z-index:1}
.map-pets-list{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:10px;z-index:2;max-height:35vh;overflow-y:auto;box-shadow:0 -2px 12px rgba(0,0,0,.1)}
.map-pet-card{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;transition:background .15s}
.map-pet-card:hover{background:var(--bg)}
.map-pet-card img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.map-toggle{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:6px}
.map-toggle button{padding:6px 10px;border-radius:20px;border:none;background:var(--card);font-size:11px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.map-toggle button.active{background:var(--green);color:#fff}

.social-user-header{text-align:center;padding:16px;background:var(--card);border-radius:16px;margin-bottom:12px}
.social-user-header .avatar-lg{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--green);margin:0 auto 8px;display:block}
.social-stats{display:flex;justify-content:space-around;background:var(--bg);border-radius:12px;padding:8px;margin:10px 0}
.social-stats div{text-align:center}.social-stats b{font-size:16px;display:block}

.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:12px;overflow:hidden}
.gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.gallery-album{margin-bottom:12px}
.gallery-album h4{font-size:12px;color:var(--soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}

.timeline{position:relative;padding-left:20px;margin:12px 0}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.timeline-item{position:relative;margin-bottom:16px;padding:10px;background:var(--card);border-radius:10px}
.timeline-item::before{content:'';position:absolute;left:-17px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.timeline-item .date{font-size:10px;color:var(--soft)}

.ai-match-card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;border-left:4px solid var(--green)}
.ai-match-score{font-size:20px;font-weight:800;color:var(--green);min-width:42px;text-align:center}
.ai-match-reasons{font-size:10px;color:var(--soft);margin-top:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.connection-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.connection-dot.online{background:#4CAF50}.connection-dot.offline{background:#f44336}

.cart-icon{position:relative}.cart-badge{position:absolute;top:-2px;right:-2px;background:var(--coral);color:#fff;font-size:7px;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.media-video{width:100%;max-height:280px;background:var(--greenSoft)}

/* ===== Home redesenhada ===== */
.home-hero{background:linear-gradient(150deg,var(--green) 0%,var(--green2) 100%);border-radius:0 0 28px 28px;padding:18px 16px 16px;color:#fff;position:relative;overflow:hidden}
.home-hero::after{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.06);right:-45px;top:-45px}
.home-hero::before{content:'';position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.05);right:75px;bottom:-55px}
.home-hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.home-welcome{font-size:11px;font-weight:800;color:#A7CFC3;letter-spacing:.5px;text-transform:uppercase}
.home-hello{font-size:21px;font-weight:900;margin:2px 0 8px}
.home-sub{font-size:13px;font-weight:600;color:rgba(255,255,255,.92)}
.home-hero-icons{display:flex;gap:6px}
.home-hero-icons .icon-btn{background:rgba(255,255,255,.15);color:#fff;box-shadow:none;backdrop-filter:blur(4px)}
.home-hero-icons .notif-badge,.home-hero-icons .cart-badge{background:var(--coral);color:#fff;border:1px solid rgba(255,255,255,.4)}
.home-plan-chip{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:9px;font-weight:800;padding:4px 9px;border-radius:20px;margin-top:12px;cursor:pointer;letter-spacing:.3px}
.home-section-title{display:flex;align-items:center;gap:6px;margin:20px 0 10px}
.home-section-title h2{margin:0;font-size:15px;font-weight:800;color:var(--ink)}
.home-more{margin-left:auto;font-size:10px;color:var(--green);font-weight:800;background:var(--greenSoft);border:none;padding:5px 10px;border-radius:20px;cursor:pointer}
.home-pets-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;-ms-overflow-style:none}
.home-pets-scroll::-webkit-scrollbar{display:none}
.home-pet-card{min-width:148px;max-width:148px;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;animation:fadeIn .3s ease}
.home-pet-card:active{transform:scale(.97)}
.home-pet-photo{width:100%;height:104px;border-radius:13px;background:var(--greenSoft);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.home-pet-photo img{width:100%;height:100%;object-fit:cover}
.home-pet-name{font-size:13px;font-weight:800;margin-top:8px}
.home-pet-breed{font-size:10px;color:var(--soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-pet-status{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;border-radius:20px;padding:3px 9px;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-pet-status.ok{background:var(--greenSoft);color:var(--green)}
.home-pet-status.warn{background:var(--orangeSoft);color:#B26A00}
.home-pet-add{border:1.5px dashed var(--line);box-shadow:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}
.home-empty{background:var(--card);border-radius:18px;padding:20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.05);animation:fadeIn .3s ease}
.home-map-card{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06);animation:fadeIn .3s ease}
.home-map-preview{height:108px;position:relative;background-color:var(--greenSoft);background-image:repeating-linear-gradient(0deg,transparent 0 30px,rgba(255,255,255,.6) 30px 32px),repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.55) 34px 36px);overflow:hidden}
.home-map-pin{position:absolute;width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:fadeIn .3s ease}
.home-map-pin img{width:100%;height:100%;object-fit:cover}
.home-map-pin.you{width:28px;height:28px;background:var(--coral);display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid #fff;box-shadow:0 0 0 4px rgba(231,111,81,.25)}
.home-map-info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
.home-map-info b{font-size:16px;font-weight:900;color:var(--ink)}
.home-map-info .small{display:block;color:var(--soft);font-size:10px}
.home-link{color:var(--blue);font-weight:800;font-size:11px;background:var(--blueSoft);padding:7px 12px;border-radius:20px;flex-shrink:0}
.home-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.home-quick-item{background:var(--card);border-radius:16px;padding:13px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.05);transition:transform .15s;animation:fadeIn .3s ease}
.home-quick-item:active{transform:scale(.97)}
.home-quick-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.home-quick-icon.green{background:var(--greenSoft)}
.home-quick-icon.coral{background:var(--coralSoft)}
.home-quick-icon.blue{background:var(--blueSoft)}
.home-quick-icon.gold{background:var(--goldSoft)}
.home-quick-item b{font-size:11px;font-weight:700;line-height:1.3}
.home-newpost{background:linear-gradient(135deg,var(--coral),#F29E81);border:none;width:100%;margin-bottom:12px;padding:11px;border-radius:12px;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(231,111,81,.28)}

/* ===== Explorar / Mapa redesenhado ===== */
.explore-header{padding:20px 16px 18px;background:linear-gradient(180deg,var(--green) 0%,var(--green2) 100%);border-radius:0 0 28px 28px;color:#fff;position:relative;overflow:hidden}
.explore-header::after{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);right:-40px;top:-50px}
.explore-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.explore-title{font-size:22px;font-weight:900}
.explore-sub{font-size:12px;color:rgba(255,255,255,.85);margin-top:2px;font-weight:600}
.explore-ai{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:10px;font-weight:800;padding:7px 10px;border-radius:20px;cursor:pointer;flex-shrink:0}
.explore-loc{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px;margin-top:12px;color:#fff}
.explore-loc-ok{color:#B7E4C7;font-weight:800;text-transform:uppercase;font-size:8px;letter-spacing:.4px}
.explore-search{display:flex;gap:6px;margin-top:12px;position:relative}
.explore-search input{flex:1;border:none;border-radius:12px;padding:10px 12px;font-size:12px;outline:none;color:var(--ink);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.explore-search button{border:none;background:var(--coral);color:#fff;border-radius:12px;padding:0 14px;font-size:11px;font-weight:800;cursor:pointer}
.map-hero{background:var(--card);border-radius:22px;padding:10px 10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.06);margin-top:14px;animation:fadeIn .3s ease}
.map-wrap{height:330px;border-radius:18px;overflow:hidden;position:relative;z-index:1}
#mapaView{width:100%;height:100%}
.map-loading{position:absolute;inset:0;border-radius:18px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:5;backdrop-filter:blur(2px)}
.map-locate{position:absolute;top:12px;right:12px;z-index:6;width:40px;height:40px;border-radius:50%;border:none;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;font-size:17px}
.explore-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.explore-chips::-webkit-scrollbar{display:none}
.chip{border:none;background:var(--bg);color:var(--soft);font-size:11px;font-weight:800;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.active{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(36,92,79,.3)}
.explore-section{margin-top:22px}
.explore-sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.explore-sec-head h2{margin:0;font-size:15px;font-weight:800;color:var(--ink)}
.explore-more{border:none;background:var(--greenSoft);color:var(--green);font-size:10px;font-weight:800;padding:6px 11px;border-radius:18px;cursor:pointer}
.explore-link{color:var(--blue);font-weight:800;font-size:12px;background:var(--blueSoft);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nearby-cards{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.nearby-cards::-webkit-scrollbar{display:none}
.nearby-card{min-width:140px;max-width:140px;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;animation:fadeIn .3s ease}
.nearby-card:active{transform:scale(.97)}
.nearby-photo{width:100%;height:96px;border-radius:12px;background:var(--greenSoft);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.nearby-photo img{width:100%;height:100%;object-fit:cover}
.nearby-info b{display:block;font-size:13px;margin-top:7px}
.nearby-type{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearby-dist{display:inline-block;font-size:9px;font-weight:800;color:var(--blue);background:var(--blueSoft);border-radius:12px;padding:2px 7px;margin-top:6px}
.nearby-sig{font-size:9px;color:var(--soft);margin-top:5px}
.explore-empty{background:var(--card);border-radius:16px;padding:18px;text-align:center;font-size:12px;color:var(--soft);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.explore-empty.ok{color:var(--green);background:var(--greenSoft)}
.lost-cards{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.lost-cards::-webkit-scrollbar{display:none}
.lost-card{min-width:235px;max-width:235px;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 3px 10px rgba(0,0,0,.06);display:flex;gap:10px;align-items:center;border-left:4px solid var(--coral);animation:fadeIn .3s ease}
.lost-photo{width:58px;height:58px;border-radius:12px;background:var(--coralSoft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.lost-photo img{width:100%;height:100%;object-fit:cover}
.lost-info{flex:1;min-width:0}
.lost-info b{display:block;font-size:12px}
.lost-pos{display:inline-block;font-size:9px;font-weight:800;color:var(--coral);background:var(--coralSoft);border-radius:12px;padding:2px 7px;margin-top:4px}
.lost-met{display:block;font-size:9px;color:var(--soft);margin-top:4px}
.lost-detail{border:none;background:var(--coral);color:#fff;font-size:9px;font-weight:800;padding:7px 10px;border-radius:10px;cursor:pointer;flex-shrink:0}
.svc-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.svc-chips::-webkit-scrollbar{display:none}
.svc-chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:10px;font-weight:800;padding:7px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
.svc-chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.svc-grid{display:flex;flex-direction:column;gap:8px}
.svc-row{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;animation:fadeIn .3s ease}
.svc-ico{width:42px;height:42px;border-radius:12px;background:var(--greenSoft);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;font-weight:800;color:var(--green)}
.svc-info{flex:1;min-width:0}
.svc-info b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc-meta,.svc-price{font-size:10px;color:var(--soft)}
.svc-price{color:var(--green);font-weight:800}
.svc-book{background:var(--green);color:#fff;font-size:9px;font-weight:800;padding:7px 10px;border-radius:10px;flex-shrink:0}
.svc-all{margin-top:12px;display:block;width:100%}
.community-teaser{background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.05);animation:fadeIn .3s ease}
.community-teaser b{font-size:12px;display:block}
.community-teaser .explore-link{margin-left:auto}
.explore-quick-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.explore-quick-icon.green{background:var(--greenSoft)}
.map-marker.pet{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.map-marker.pet img{width:100%;height:100%;object-fit:cover}
.map-marker.lost{width:36px;height:36px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.map-cluster{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.map-wrap .leaflet-control-attribution{font-size:8px}
#exploreResults{border-radius:18px;padding:12px;margin-top:12px;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.06);max-height:60vh;overflow-y:auto;animation:fadeIn .25s ease}
.sr-head{font-size:11px;color:var(--soft);margin-bottom:8px}
.sr-group{font-size:10px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
.sr-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer}
.sr-item:hover{background:var(--greenSoft)}
.sr-ico{width:38px;height:38px;border-radius:10px;background:var(--greenSoft);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;font-weight:800;color:var(--green)}
.sr-ico.pet{overflow:hidden;padding:0}
.sr-ico.pet img{width:100%;height:100%;object-fit:cover}
.sr-ico.lost{background:var(--coralSoft);color:var(--coral)}
.sr-ico.user{background:var(--blueSoft);color:var(--blue);font-size:14px}
.sr-item b{font-size:12px;display:block}
.sr-item .small{font-size:10px}
.sr-go{width:22px;height:22px;font-size:11px}

/* ===== Feed da Comunidade (Etapa 4) ===== */
.feed-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.feed-chips::-webkit-scrollbar{display:none}
.feed-chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--soft);font-size:11px;font-weight:700;padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .2s}
.feed-chip.active{background:var(--green);border-color:var(--green);color:#fff}
.discover-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.discover-scroll::-webkit-scrollbar{display:none}
.discover-pet{min-width:112px;max-width:132px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;cursor:pointer;transition:transform .15s}
.discover-pet:active{transform:scale(.97)}
.discover-pet .discover-photo{width:72px;height:72px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;background:var(--bg);border:2px solid var(--green)}
.discover-pet .discover-photo img{width:100%;height:100%;object-fit:cover}
.discover-pet b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.discover-pet .small{display:block;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-pet{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 3px;margin:0 12px 8px;font-size:11px;font-weight:700;color:var(--green);cursor:pointer}
.post-pet img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--greenSoft)}
.post-pet .post-pet-emoji{font-size:16px;padding:2px}
.post-loc{color:var(--green);font-weight:700}
.comment-pet{display:inline-block;background:var(--greenSoft);color:var(--green);border-radius:8px;padding:1px 7px;font-size:9px;font-weight:700;margin-right:5px}
.comment-del{border:0;background:none;color:var(--coral);font-size:12px;cursor:pointer;float:right}

/* ===== Perfil do Pet (Etapa 3) ===== */
.pp-hero{background:linear-gradient(150deg,var(--green) 0%,var(--green2) 100%);border-radius:0 0 26px 26px;padding:14px 16px 18px;color:#fff;text-align:center;position:relative;overflow:hidden}
.pp-hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);right:-45px;top:-45px}
.pp-hero::before{content:'';position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);right:80px;bottom:-50px}
.pp-avatar{width:106px;height:106px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.28);margin:6px auto 10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:44px}
.pp-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pp-name{font-size:23px;font-weight:900;letter-spacing:.3px;text-transform:capitalize}
.pp-breed{font-size:12px;font-weight:600;color:rgba(255,255,255,.92);margin-top:3px}
.pp-loc{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 11px;border-radius:20px;margin-top:9px}
.pp-vax{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;border-radius:20px;padding:4px 11px;margin-top:8px}
.pp-vax.ok{background:#0F3229;color:#8FD6B8;border:1px solid rgba(143,214,184,.5)}
.pp-vax.warn{background:#FFF0DB;color:#8A4B00;border:1px solid rgba(255,170,90,.6)}
.pp-actions{display:flex;gap:8px;justify-content:center;margin-top:13px}
.pp-actions .btn{background:#fff;color:var(--green);border:none;font-weight:800}
.pp-actions .btn.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}
.pp-card{background:linear-gradient(135deg,#1A3C33,#2E5F4F);border-radius:24px;color:#fff;padding:18px;margin-top:16px;box-shadow:0 12px 28px rgba(20,60,50,.38);position:relative;overflow:hidden;animation:fadeIn .3s ease}
.pp-card::before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);right:-35px;top:-35px}
.pp-card::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.05);left:-25px;bottom:-30px}
.pp-card-top{display:flex;align-items:center;gap:12px;position:relative}
.pp-card-logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#FFE259,#FFA751);color:#5A3900;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.pp-card-name{font-size:21px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.pp-card-sub{font-size:11px;color:rgba(255,255,255,.78)}
.pp-card-badge{margin-left:auto;flex-shrink:0;font-size:8px;font-weight:900;letter-spacing:.6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);padding:5px 9px;border-radius:20px}
.pp-card-traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative}
.pp-card-trait{font-size:9px;font-weight:800;background:rgba(255,255,255,.13);padding:4px 9px;border-radius:12px}
.pp-card-empty{font-size:10px;color:rgba(255,255,255,.5);font-weight:600}
.pp-card-rows{margin-top:13px;border-top:1px solid rgba(255,255,255,.14);padding-top:10px;position:relative}
.pp-card-row{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:4px 0}
.pp-card-row .muted{color:rgba(255,255,255,.88)}
.pp-info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pp-info-item{background:var(--card);border-radius:14px;padding:11px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.pp-info-item .k{font-size:9px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.pp-info-item .v{font-size:13px;font-weight:800;margin-top:3px;color:var(--ink);text-transform:capitalize}
.pp-info-item .v .dash{color:var(--soft)}
.pp-panel{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,.05);animation:fadeIn .3s ease}
.pp-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pp-panel-head b{font-size:13px;color:var(--ink)}
.pp-panel-add{border:none;background:var(--greenSoft);color:var(--green);font-weight:800;font-size:10px;padding:5px 11px;border-radius:16px;cursor:pointer}
.pp-health-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pp-health-row:last-child{border-bottom:none}

function connectWS() {
  if (!token) return;
  if (ws && ws.readyState <= 1) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws?token=' + token);
  ws.onopen = () => { console.log('[WS] Connected'); if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; } };
  ws.onclose = () => { console.log('[WS] Disconnected'); wsReconnectTimer = setTimeout(connectWS, 3000); };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    handleWSMessage(msg);
  };
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'connected': break;
    case 'new_post':
      if (tab === 'inicio' && msg.post && !posts.find(p => p.id === msg.post.id)) {
        posts.unshift(msg.post);
        if (tab === 'inicio') renderInicio();
      }
      break;
    case 'post_like':
      if (tab === 'inicio') {
        const p = posts.find(p => p.id === msg.postId);
        if (p) { p.likes = msg.likes; }
        renderInicio();
      }
      break;
    case 'new_comment':
      if (tab === 'inicio') {
        const p = posts.find(p => p.id === msg.postId);
        if (p) { p.comments_count = (p.comments_count || 0) + 1; }
        renderInicio();
      }
      break;
    case 'new_message':
      if (chatMatchId === msg.matchId) {
        loadChatMessages();
      } else {
        unreadCount++;
        showToast('Nova mensagem!');
      }
      break;
    case 'typing':
      if (chatMatchId === msg.matchId) {
        isTyping[msg.userId] = true;
        const el = document.getElementById('chatTyping');
        if (el) el.style.display = 'block';
        setTimeout(() => { isTyping[msg.userId] = false; if (el) el.style.display = 'none'; }, 2000);
      }
      break;
    case 'read':
      if (chatMatchId === msg.matchId) {
        const el = document.getElementById('chatLastSeen');
        if (el) el.textContent = 'Lida';
      }
      break;
    case 'new_match':
      showToast('Novo match! Voce e alguem se curtiram!');
      break;
    case 'partnership_request':
      showToast(msg.message || 'Nova solicitacao de parceria!');
      break;
    case 'partnership_accepted':
      showToast(msg.message || 'Parceria aceita!');
      break;
    case 'new_follower':
      showToast('Alguem comecou a te seguir!');
      break;
    case 'new_story':
      showToast(msg.story?.user_name + ' postou um story!');
      break;
    case 'new_reel':
      showToast('Novo reel disponivel!');
      break;
    case 'notification':
      unreadCount++;
      showToast(msg.notification?.message || 'Nova notificacao');
      break;
    case 'pong': break;
  }
}

function showToast(text) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;font-weight:700;z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadeIn .3s';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

function sendWS(data) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(data)); }

const screen = document.getElementById('screen');
const nav = document.getElementById('bottomNav');

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function su(s){s=String(s||'').trim();if(!/^https?:\/\//i.test(s))return'';return s.replace(/[\u0000-\u001f\u2028\u2029\s"<>'`\\]/g,encodeURIComponent)}
function sj(s){return String(s||'').replace(/[\\'"&<>\r\n\u2028\u2029]/g,function(c){if(c==='\\')return'\\\\';if(c==="'")return"\\'";if(c==='"')return'&quot;';if(c==='&')return'&amp;';if(c==='<')return'&lt;';if(c==='>')return'&gt;';if(c==='\n')return'\\n';if(c==='\r')return'\\r';if(c==='\u2028')return'\\u2028';return'\\u2029';})}

function getBadge(b){if(b==='pro')return'<span class="badge-pro">PRO</span>';if(b==='plus'||b==='tutor')return'<span class="badge-plus">TUTOR</span>';return'<span class="badge-free">FREE</span>';}

function adHTML(){if(!currentUser||currentUser.plan!=='free')return'';return'<div class="ad-banner"><div><span class="ad-badge">ANUNCIO</span><div style="font-weight:800;font-size:11px;margin-top:2px">Racao Premium 20% OFF</div></div><button class="btn small-btn outline" onclick="openModal(\'plans\')">Sem Ads (R$4,99)</button></div>';}

function header(title,subtitle,action=''){
  let planTxt=currentUser?(currentUser.plan==='pro'?'PRO':currentUser.plan==='plus'||currentUser.plan==='tutor'?'TUTOR':'FREE'):'PLANOS';
  let bell=currentUser?`<button class="icon-btn notif-btn" onclick="toggleNotifs()" aria-label="Notificacoes"><span>&#128276;</span>${unreadCount>0?`<span class="notif-badge">${unreadCount}</span>`:''}</button>`:'';
  let cartBtn=currentUser?`<button class="icon-btn cart-icon" onclick="renderCart()" aria-label="Carrinho"><span>&#128722;</span>${cartCount>0?`<span class="cart-badge">${cartCount}</span>`:''}</button>`:'';

}

async function api(path,opts={}){
  const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  try{
    const r=await fetch(API+path,{...opts,headers:{...headers,...opts.headers}});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Erro na API');
    return data;
  }catch(e){throw e;}
}

function showLoading(){screen.innerHTML=header('ZUNNU','')+'<div class="content"><div class="skeleton"></div><div class="skeleton" style="height:200px"></div><div class="skeleton"></div></div>';}

function applyTheme(){document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');localStorage.setItem('zunnu_dark',darkMode?'1':'0');}

function formatDate(dateStr){
  if(!dateStr)return'agora';
  const diff=(Date.now()-new Date(dateStr+'Z').getTime())/1000;
  if(diff<60)return'agora';
  if(diff<3600)return'ha '+Math.floor(diff/60)+' min';
  if(diff<86400)return'ha '+Math.floor(diff/3600)+'h';
  return'ha '+Math.floor(diff/86400)+' dias';
}
function calculateAge(birthDateString){
  if(!birthDateString)return 0;
  const today=new Date();const birth=new Date(birthDateString);
  let age=today.getFullYear()-birth.getFullYear();
  const m=today.getMonth()-birth.getMonth();
  if(m<0||(m===0&&today.getDate()<birth.getDate()))age--;
  return age;
}

function renderAuth(){
  nav.style.display='none';
  screen.innerHTML=`<div class="content" style="padding-top:24px"><div style="background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center"><div class="logo" style="margin:0 auto 10px;font-size:24px;width:50px;height:50px">P</div><h2 style="margin:0 0 6px">${authMode==='login'?'Entrar no ZUNNU':'Criar Conta no ZUNNU'}</h2><p class="small" style="margin-bottom:14px">${authMode==='login'?'Acesse a comunidade e cuide do seu pet':'Cadastro seguro de tutores (+18 anos)'}</p>
  ${authMode==='register'?`<div class="field"><label>Nome Completo</label><input id="regName" placeholder="Seu nome"></div><div class="field"><label>Data de Nascimento (+18)</label><input id="regBirth" type="date"></div>`:''}
  <div class="field"><label>E-mail</label><input id="authEmail" type="email" placeholder="seu@email.com"></div>
  <div class="field"><label>Senha</label><input id="authPass" type="password" placeholder="Minimo 6 caracteres"></div>
  <button class="btn" style="width:100%;margin-top:8px" onclick="handleAuth()">${authMode==='login'?'Acessar Conta':'Concluir Cadastro'}</button>
  <div style="margin-top:14px;font-size:11px"><a href="#" onclick="toggleAuth()" style="color:var(--green);font-weight:800">${authMode==='login'?'Nao tem conta? Criar agora':'Ja tenho conta'}</a></div></div></div>`;
}

function toggleAuth(){authMode=authMode==='login'?'register':'login';renderAuth();}

async function handleAuth(){
  try{
    if(authMode==='register'){
      const name=document.getElementById('regName')?.value.trim();
      const birth=document.getElementById('regBirth')?.value;
      const email=document.getElementById('authEmail')?.value.trim();
      const pass=document.getElementById('authPass')?.value;
      if(!name){alert('Informe seu nome.');return;}
      if(!birth){alert('Informe sua data de nascimento.');return;}
      if(!email){alert('Informe seu email.');return;}
      if(!pass||pass.length<6){alert('Senha deve ter minimo 6 caracteres.');return;}
      const age=calculateAge(birth);
      if(age<18){alert('Cadastro restrito a maiores de 18 anos.');return;}
      const data=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name,email,password:pass,birthDate:birth})});
      token=data.token;localStorage.setItem('zunnu_token',token);
      currentUser=data.user;currentUser.plan='free';currentUser.stats={pets:0,posts:0,matches:0};
    }else{
      const email=document.getElementById('authEmail')?.value.trim();
      const pass=document.getElementById('authPass')?.value;
      if(!email||!pass){alert('Preencha email e senha.');return;}
      const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});
      token=data.token;localStorage.setItem('zunnu_token',token);
      await loadProfile();
    }
    loadAll();
  }catch(e){alert('Erro: '+e.message);}
}

async function loadProfile(){
  try{
    const data=await api('/api/auth/me');
    currentUser=data;currentUser.plan=data.plan||'free';
  }catch(e){token=null;localStorage.removeItem('zunnu_token');}
}

async function loadAll(){
  showLoading();
  try{
    if(!currentUser)await loadProfile();
    if(!currentUser){renderAuth();return;}
    applyTheme();
const[postsData,notifData,petsData,storiesDataRaw,nearbyData,communityPetsData]=await Promise.all([
      api('/api/posts?page='+postPage+'&limit=10&filter='+feedFilter).catch(()=>({posts:[],total:0,pages:1,err:true})),
      api('/api/notifications').catch(()=>({notifications:[],unreadCount:0})),
      api('/api/pets').catch(()=>[]),
      api('/api/stories').catch(()=>({stories:[],my_story:null})),
      api('/api/nearby/pets?lat='+(window._userLat||-2.5307)+'&lng='+(window._userLng||-44.2829)+'&radius=20').catch(()=>[]),
      api('/api/pets/all?limit=12').catch(()=>[]),
      loadCart().catch(()=>{}),
      loadLostPets().catch(()=>{})
    ]);
    posts=postsData.posts||[];postPages=postsData.pages||1;feedError=postsData.err?true:false;
    notifications=notifData.notifications||[];unreadCount=notifData.unreadCount||0;
    pets=Array.isArray(petsData)?petsData:[];
    storiesData=storiesDataRaw.stories||[];myStory=storiesDataRaw.my_story||null;
    homeNearby=Array.isArray(nearbyData)?nearbyData:[];
    communityPets=(communityPetsData&&Array.isArray(communityPetsData.pets)?communityPetsData.pets:Array.isArray(communityPetsData)?communityPetsData:[]).filter(p=>p.user_id!==currentUser?.id).slice(0,10);
    render();
  }catch(e){console.error(e);renderAuth();}
}

function logout(){token=null;localStorage.removeItem('zunnu_token');currentUser=null;render();}
function parseBR(d){const m=d?d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/):null;return m?new Date(+m[3],+m[2]-1,+m[1]):null;}
function petHomeStatus(p){
  const vs=p.vaccines||[];
  if(vs.length===0)return{txt:'Sem vacinas ainda',cl:'ok'};
  const today=new Date();today.setHours(0,0,0,0);
  const pending=vs.find(v=>v.status==='Agendada'||v.status==='A agendar')||vs.find(v=>{const d=parseBR(v.date);return d&&d>=today;});
  if(pending)return{txt:'Proxima vacina: '+(pending.name||'em breve'),cl:'warn'};
  return{txt:'Tudo em dia',cl:'ok'};
}

function zodiacFromDate(bd){
  if(!bd)return'';
  const b=new Date(bd);if(isNaN(b.getTime()))return'';
  const m=b.getMonth()+1,d=b.getDate();
  if((m===1&&d>=20)||(m===2&&d<=18))return'Aquario';
  if((m===2&&d>=19)||(m===3&&d<=20))return'Peixes';
  if((m===3&&d>=21)||(m===4&&d<=19))return'Aries';
  if((m===4&&d>=20)||(m===5&&d<=20))return'Touro';
  if((m===5&&d>=21)||(m===6&&d<=20))return'Gemeos';
  if((m===6&&d>=21)||(m===7&&d<=22))return'Cancer';
  if((m===7&&d>=23)||(m===8&&d<=22))return'Leao';
  if((m===8&&d>=23)||(m===9&&d<=22))return'Virgem';
  if((m===9&&d>=23)||(m===10&&d<=22))return'Libra';
  if((m===10&&d>=23)||(m===11&&d<=21))return'Escorpiao';
  if((m===11&&d>=22)||(m===12&&d<=21))return'Sagitario';
  return'Capricornio';
}
function petAgeText(bd){
  if(!bd)return'';
  const b=new Date(bd);if(isNaN(b.getTime()))return'';
  const n=new Date();
  let y=n.getFullYear()-b.getFullYear();
  const m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();
  if(m<0||(m===0&&d<0))y--;
  const mo=y*12+m+(d<0?-1:0);
  if(y>=1)return y+' ano'+(y>1?'s':'');
  if(mo>=1)return mo+' mes'+(mo>1?'es':'');
  const dd=Math.max(1,Math.floor((n-b)/86400000));
  return dd+' dia'+(dd>1?'s':'');
}
function petIdade(p){return petAgeText(p&&p.birth_date)||(p&&p.age)||'idade nao informada';}
function petTraitsList(t){return String(t||'').split(',').map(s=>s.trim()).filter(Boolean);}
function formatDateBR(s){
  const m=s?String(s).match(/^(\d{4})-(\d{2})-(\d{2})/):null;
  return m?m[3]+'/'+m[2]+'/'+m[1]:String(s||'');
}

function setFeedFilter(f){feedFilter=f;postPage=1;feedError=false;loadAll();}

async function loadMoreFeed(){
  if(feedLoadingMore)return;
  feedLoadingMore=true;render();
  try{
    const d=await api('/api/posts?page='+(postPage+1)+'&limit=10&filter='+feedFilter);
    const have=new Set(posts.map(x=>x.id));
    const fresh=(d.posts||[]).filter(x=>!have.has(x.id));
    posts=posts.concat(fresh);postPage+=1;postPages=d.pages||postPages;
  }catch(e){feedError=posts.length===0;}
  feedLoadingMore=false;render();
}

async function hidePost(id){

async function blockUser(uid){
  if(!confirm('Bloquear este usuario? Os posts dele deixarao de aparecer para voce.'))return;
  try{
    await api('/api/social/block/'+uid,{method:'POST'});
    posts=posts.filter(p=>p.user_id!==uid);
    posts.forEach(p=>{if(p.user_id===uid)delete showComments[p.id];});
    render();showToast('Usuario bloqueado');
  }catch(e){alert(e.message);}
}

async function toggleLike(id){

function toggleComments(id){

let curSharePost=null;
function sharePost(id){
  curSharePost=id;
  const url=window.location.origin+'/post/'+id;
  const root=document.createElement('div');root.id='share-root';
  root.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeShare()"><div class="modal"><div class="modal-head"><div class="modal-title">Compartilhar</div><button class="close" onclick="closeShare()">X</button></div>
    <p class="small" style="margin:0 0 10px">Compartilhe este momento do Patai!</p>
    <button class="btn" style="width:100%;margin-bottom:8px" onclick="shareExternal('${url}')">&#128228; Compartilhar externamente</button>
    <button class="btn outline" style="width:100%" onclick="shareCopy('${url}')">&#128203; Copiar link</button>
  </div></div>`;
  document.body.appendChild(root);
}
function closeShare(){document.getElementById('share-root')?.remove();curSharePost=null;}
async function doShare(){
  const id=curSharePost;
  if(id){try{await api('/api/posts/'+id+'/share',{method:'POST'});const p=posts.find(x=>x.id===id);if(p){p.shares=(p.shares||0)+1;}}catch(e){}}
  closeShare();render();
}
async function shareExternal(url){
  doShare();
  if(navigator.share){try{await navigator.share({title:'Patai',text:'Confira este post no Patai!',url});}catch(e){}}
  else{navigator.clipboard?.writeText(url);showToast('Link copiado!');}
}
function shareCopy(url){
  doShare();
  navigator.clipboard?.writeText(url);showToast('Link copiado!');
}

async function reportPost(id){
  const categories=['Conteudo improprio','Ofensa','Golpe','Maus-tratos','Spam','Outro'];
  const cat=prompt('Categoria da denuncia:\n'+categories.map((c,i)=>(i+1)+'. '+c).join('\n'));

  const idx=parseInt(cat)-1;
  const category=categories[idx]||cat;

  try{await api('/api/posts/'+id+'/report',{method:'POST',body:JSON.stringify({reason,category:category})});alert('Denuncia recebida!');}catch(e){alert(e.message);}

async function respondPartnership(requestId, accept) {
  try {
    const d = await api('/api/match/respond/'+requestId,{method:'POST',body:JSON.stringify({accept})});
    if(d.match){ alert('Parceria aceita! Chat liberado!'); }
    else { alert(accept?'Parceria criada!':'Parceria recusada.'); }
    renderPartnershipPending();
  } catch(e) { alert(e.message); }
}

async function openPetProfile(petId){

async function toggleNotifs(){
  const el=document.getElementById('notifDropdown');
  if(el){el.remove();return;}
  const existing=document.querySelector('.notif-dropdown');
  if(existing){existing.remove();return;}
  const data=await api('/api/notifications').catch(()=>({notifications:[],unreadCount:0}));
  notifications=data.notifications||[];unreadCount=data.unreadCount||0;
  const btn=document.querySelector('.notif-btn');
  if(!btn)return;
  const div=document.createElement('div');div.className='notif-dropdown';
  div.innerHTML=notifications.length===0?'<div style="padding:12px;text-align:center;font-size:11px;color:var(--soft)">Sem notificacoes</div>':
    notifications.slice(0,10).map(n=>`<div class="notif-item ${n.is_read?'':'unread'}" onclick="readNotif(${n.id})">${esc(n.message)}<br><span class="small">${formatDate(n.created_at)}</span></div>`).join('');
  btn.appendChild(div);
}

async function readNotif(id){
  try{await api('/api/notifications/read/'+id,{method:'POST'});unreadCount=Math.max(0,unreadCount-1);toggleNotifs();}catch(e){}
}

async function saveAvatar(urlOverride){
  const url=urlOverride!==undefined?urlOverride:document.getElementById('newAvatarUrl')?.value.trim();
  try{
    const data=await api('/api/auth/me',{method:'PUT',body:JSON.stringify({avatar:url||''})});
    if(currentUser){currentUser.avatar=data.avatar;currentUser.selfie_url=data.selfie_url;}
    closeModal();setTab('perfil');alert('Foto atualizada!');
  }catch(e){alert(e.message);}
}

async function savePet(){

  const species=document.getElementById('pSpecies')?.value||'Pet';
  const birth=document.getElementById('pBirth')?.value||'';
  const pesoEl=document.getElementById('pPeso');
  try{
    const body={
      name,
      species,
      breed:document.getElementById('pBreed')?.value.trim()||'SRD',
      sex:document.getElementById('pSex')?.value||'',
      birthDate:birth,
      porte:document.getElementById('pPorte')?.value||'',
      cor:document.getElementById('pCor')?.value.trim()||'',
      peso:(pesoEl&&pesoEl.value!=='')?parseFloat(pesoEl.value):null,
      microchip:document.getElementById('pChip')?.value.trim()||'',
      image:document.getElementById('pImage')?.value.trim()||'',
      age:petAgeText(birth),
      zodiac:zodiacFromDate(birth),
      traits:editingPetId&&currentPetProfile?(currentPetProfile.traits||''):'',
      visibility:editingPetId&&currentPetProfile?(currentPetProfile.visibility||'public'):'public'
    };
    let p;
    if(editingPetId){
      p=await api('/api/pets/'+editingPetId,{method:'PUT',body:JSON.stringify(body)});
      const idx=pets.findIndex(x=>x.id===p.id);
      if(idx>=0)pets[idx]=p;else pets.unshift(p);
      closeModal();
      currentPetProfile=p;
      await refreshPetProfile();
    }else{
      p=await api('/api/pets',{method:'POST',body:JSON.stringify(body)});
      pets.unshift(p);
      closeModal();
      openPetProfile(p.id);
    }
  }catch(e){alert(e.message);}
}

function fallbackCopy(text){

  document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('Codigo Pix copiado!');}catch(e){alert('Nao foi possivel copiar. Copie manualmente.');}
  document.body.removeChild(ta);
}

function showStorySlide(){
  if(!viewingStory||storyIdx>=viewingStory.stories.length){closeStory();return;}
  const s=viewingStory.stories[storyIdx];
  const existing=document.getElementById('storyViewer');if(existing)existing.remove();
  api('/api/stories/'+s.id+'/view',{method:'POST'}).catch(()=>{});
  const el=document.createElement('div');el.className='story-viewer';el.id='storyViewer';
  el.innerHTML=`<div class="story-viewer-inner">
    <div class="story-progress">${viewingStory.stories.map((_,i)=>`<div class="story-progress-bar"><div class="fill" id="sp-${i}" style="width:${i<storyIdx?'100%':'0%'}"></div></div>`).join('')}</div>
    <div class="story-viewer-header">
      <img src="${su(viewingStory.user_avatar||'')}" onerror="this.style.display='none'" alt="">
      <b>${esc(viewingStory.user_name)}</b>
      <span>${formatDate(s.created_at)}</span>
    </div>
    <div class="story-close" onclick="closeStory()">&#10005;</div>
    <img class="story-viewer-img" src="${su(s.image_url)}" alt="">
    ${s.caption?`<div class="story-caption">${esc(s.caption)}</div>`:''}
    <div class="story-nav prev" onclick="prevStorySlide()"></div>
    <div class="story-nav next" onclick="nextStorySlide()"></div>
  </div>`;
  document.body.appendChild(el);
  let w=0;const bar=document.getElementById('sp-'+storyIdx);
  storyTimer=setInterval(()=>{w+=2;if(bar)bar.style.width=w+'%';if(w>=100){clearInterval(storyTimer);nextStorySlide();}},100);
}
function nextStorySlide(){clearInterval(storyTimer);storyIdx++;showStorySlide();}
function prevStorySlide(){clearInterval(storyTimer);storyIdx=Math.max(0,storyIdx-1);showStorySlide();}
function closeStory(){clearInterval(storyTimer);viewingStory=null;const el=document.getElementById('storyViewer');if(el)el.remove();}

function petEmoji(species){const m={Cachorro:'&#128054;',Gato:'&#128049;',Ave:'&#128036;',Coelho:'&#128048;',Roedor:'&#128057;',Reptil:'&#129422;',Peixe:'&#128031;'};return m[species]||'&#128062;';}
function fmtDist(km){if(km==null||isNaN(km))return'';if(km<1)return'A '+Math.max(1,Math.round(km*1000))+' m de voce';return'A '+(Math.round(km*10)/10)+' km de voce';}
function exploreDist(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180;const dLa=rad(c-a),dLo=rad(d-b);const x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLo/2)*Math.sin(dLo/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function updateExplorerLoc(){
  const el=document.getElementById('exploreLoc');if(!el)return;
  el.innerHTML=window._userLat?(window._userLat.toFixed(3))+'<b class="explore-loc-ok">Localizacao ativa</b>':'(<b>Ativando localizacao...</b>)';

function initMap(lat,lng){
  if(mapaInst){mapaInst.remove();mapaInst=null;}
  mapaInst=L.map('mapaView',{zoomControl:false}).setView([lat,lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(mapaInst);
  L.control.zoom({position:'topright'}).addTo(mapaInst);
  L.circleMarker([lat,lng],{radius:9,fillColor:'#245C4F',fillOpacity:1,color:'#fff',weight:3}).addTo(mapaInst)
    .bindPopup('Voce esta aqui');
  const lo=document.getElementById('mapLoading');
  const t=setTimeout(()=>{if(lo)lo.style.display='none';},4000);
  mapaInst.once('tilesloaded',()=>{clearTimeout(t);if(lo)lo.style.display='none';});
  setTimeout(()=>mapaInst.invalidateSize(),150);
}
async function loadNearbyPets(){
  const lat=window._userLat||-2.5307,lng=window._userLng||-44.2829;
  try{
    let url='/api/nearby/pets?lat='+lat+'&lng='+lng+'&radius=20';
    if(mapaFilter!=='all')url+='&species='+encodeURIComponent(mapaFilter);
    nearbyPets=await api(url);
    renderNearbyList();
    renderNearbyMarkers();
  }catch(e){console.error(e);}
}
function renderNearbyMarkers(){
  if(!mapaInst)return;
  mapaInst.eachLayer(l=>{if(l instanceof L.Marker)mapaInst.removeLayer(l);});
  const CELL=0.004,items=[];
  nearbyPets.forEach(p=>{if(!p.latitude||!p.longitude)return;items.push({k:'pet',p});});
  lostPets.forEach(lp=>{if(!lp.latitude||!lp.longitude)return;items.push({k:'lost',p:lp});});
  const groups={};
  items.forEach(it=>{
    const key=Math.round(it.p.latitude/CELL)+':'+Math.round(it.p.longitude/CELL);
    (groups[key]=groups[key]||[]).push(it);
  });
  Object.values(groups).forEach(g=>{
    if(g.length>=4){
      const cy=g.reduce((s,x)=>s+x.p.latitude,0)/g.length;
      const cx=g.reduce((s,x)=>s+x.p.longitude,0)/g.length;
      const icon=L.divIcon({className:'',html:'<div class="map-cluster">'+g.length+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
      L.marker([cy,cx],{icon}).addTo(mapaInst).on('click',()=>mapaInst.setView([cy,cx],mapaInst.getZoom()+1));
      return;
    }
    g.forEach(it=>{
      if(it.k==='lost'){
        const p=it.p;
        const icon=L.divIcon({className:'',html:'<div class="map-marker lost">!</div>',iconSize:[36,36],iconAnchor:[18,18]});
        L.marker([p.latitude,p.longitude],{icon}).addTo(mapaInst)
          .bindPopup('<div style="text-align:center;min-width:120px"><b style="font-size:12px;color:#E76F51">'+(p.status==='lost'?'PERDIDO':'ENCONTRADO')+'</b><br><b>'+esc(p.pet_name)+'</b><br><span style="font-size:10px">'+esc(p.species)+' '+esc(p.breed)+'</span><br><button onclick="renderLostPets()" style="margin-top:4px;font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer">Ver detalhes</button></div>');
        return;
      }
      const p=it.p;
      const icon=L.divIcon({className:'',html:'<div class="map-marker pet"><img src="'+su(p.image||'')+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'&#128062;\'"></div>',iconSize:[40,40],iconAnchor:[20,20]});
      L.marker([p.latitude,p.longitude],{icon}).addTo(mapaInst)
        .bindPopup('<div style="text-align:center;min-width:120px"><img src="'+su(p.image||'')+'" style="width:60px;height:60px;border-radius:50%;object-fit:cover" onerror="this.style.display=\'none\'"><br><b style="font-size:12px">'+esc(p.name)+'</b><br><span style="font-size:10px;color:#666">'+esc(p.breed)+' '+fmtDist(p.distance)+'</span><br><button onclick="viewUserProfile('+p.user_id+')" style="margin-top:4px;font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer">Ver Tutor</button></div>');
    });
  });
}

async function exploreSearch(){
  const inp=document.getElementById('exploreSearchInput');
  const q=(inp?.value||'').trim().toLowerCase();
  const wrap=document.getElementById('exploreResults');
  if(!wrap)return;
  if(!q){wrap.style.display='none';return;}
  wrap.style.display='block';
  wrap.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  const lat=window._userLat||-2.5307,lng=window._userLng||-44.2829;
  if(!exploreAllPets.length)exploreAllPets=await api('/api/pets/all').catch(()=>[]);
  if(!exploreAllUsers.length)exploreAllUsers=await api('/api/nearby/users?lat='+lat+'&lng='+lng+'&radius=100').catch(()=>[]);
  if(!exploreAllLP.length)exploreAllLP=await api('/api/lostpets').catch(()=>[]);
  const svc=await api('/api/services').catch(()=>[]);
  const has=s=>s&&s.toLowerCase().includes(q);
  const fP=(exploreAllPets||[]).filter(p=>has(p.name)||has(p.breed)||has(p.species));
  const fU=(exploreAllUsers||[]).filter(u=>has(u.name));
  const fS=svc.filter(s=>has(s.title)||has(s.description)||has(s.provider_name));
  const fL=(exploreAllLP||[]).filter(x=>has(x.pet_name)||has(x.breed)||has(x.species));
  const rows=[];
  if(fS.length)rows.push('<div class="sr-group">Servicos ('+fS.length+')</div>'+fS.slice(0,5).map(s=>`<div class="sr-item" onclick="openBookingModal(${s.id},'${esc(s.title)}',${s.price})"><div class="sr-ico">${s.icon||'&#128137;'}</div><div><b>${esc(s.title)}</b><span class="small">${esc(s.provider_name||'')} &bull; R$ ${(s.price||0).toFixed(2)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(fP.length)rows.push('<div class="sr-group">Pets ('+fP.length+')</div>'+fP.slice(0,5).map(p=>`<div class="sr-item" onclick="openPetDetail(${p.id})"><div class="sr-ico pet"><img src="${su(p.image||'')}" onerror="this.style.display='none'" alt=""></div><div><b>${esc(p.name)}</b><span class="small">${petEmoji(p.species)} ${esc(p.breed||p.species)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(fU.length)rows.push('<div class="sr-group">Usuarios ('+fU.length+')</div>'+fU.slice(0,5).map(u=>`<div class="sr-item" onclick="viewUserProfile(${u.id})"><div class="sr-ico user">${esc((u.name||'?')[0])}</div><div><b>${esc(u.name)}</b><span class="small">${fmtDist(u.distance)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(fL.length)rows.push('<div class="sr-group">Pets reportados ('+fL.length+')</div>'+fL.slice(0,5).map(x=>`<div class="sr-item" onclick="renderLostPets()"><div class="sr-ico lost">&#128680;</div><div><b>${esc(x.pet_name)}</b><span class="small">${x.status==='lost'?'Perdido':'Encontrado'} &bull; reportado ${formatDate(x.created_at)}</span></div><span class="explore-link sr-go">&rarr;</span></div>`).join(''));
  if(!rows.length){wrap.innerHTML='<div class="explore-empty">Nenhum resultado para "'+esc(q)+'"</div>';return;}

function renderOnboarding(){
  const steps=[
    {title:'Bem-vindo ao ZUNNU!',text:'O super app para tutores de pets. Descubra a comunidade!',icon:'&#128062;'},
    {title:'Feed & Comunidade',text:'Compartilhe fotos, historias e conecte-se com outros tutores.',icon:'&#128247;'},
    {title:'Match & Chat',text:'Encontre amigos para seu pet e converse pelo chat!',icon:'&#128148;'},
    {title:'Loja & Servicos',text:'Compre produtos e contrate servicos profissionais para seu pet.',icon:'&#128722;'}
  ];
  const s=steps[onboardingStep];
  if(!s)return;
  const overlay=document.createElement('div');overlay.className='onboarding-overlay';overlay.id='onboarding';
  overlay.innerHTML=`<div class="onboarding-card"><div style="font-size:48px;margin-bottom:12px">${s.icon}</div><h3 style="margin:0 0 8px">${s.title}</h3><p class="small">${s.text}</p><div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
    ${onboardingStep>0?'<button class="btn small-btn outline" onclick="prevOnboarding()">Voltar</button>':''}
    <button class="btn" onclick="nextOnboarding()">${onboardingStep<steps.length-1?'Proximo':'Comecar!'}</button>
  </div><div style="margin-top:8px;font-size:10px;color:var(--soft)">${onboardingStep+1}/${steps.length}</div></div>`;
  document.body.appendChild(overlay);
}

function nextOnboarding(){onboardingStep++;document.getElementById('onboarding')?.remove();if(onboardingStep>=4){closeOnboarding();return;}renderOnboarding();}
function prevOnboarding(){onboardingStep--;document.getElementById('onboarding')?.remove();renderOnboarding();}
function closeOnboarding(){document.getElementById('onboarding')?.remove();localStorage.setItem('zunnu_onboarded','1');}

async function checkOnboarding(){
  if(!localStorage.getItem('zunnu_onboarded')&&currentUser){
    try{const postsData=await api('/api/posts?limit=5');if((postsData.posts||[]).length<3){onboardingStep=0;renderOnboarding();}}catch(e){}

}

async function loadCart() {

}

function renderCart() {
  screen.innerHTML = header('Meu Carrinho','')+`<div class="content">
    ${cartItems.length===0?'<p style="text-align:center;color:var(--soft);padding:40px">Carrinho vazio<br><br><button class="btn" onclick="setTab(\'inicio\')">Ver Produtos</button></p>':''}
    ${cartItems.map(c=>`<div style="display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px">
      <img src="${su(c.image||'')}" style="width:60px;height:60px;border-radius:8px;object-fit:cover" onerror="this.style.display='none'">
      <div style="flex:1"><b style="font-size:12px">${esc(c.title)}</b><div class="product-price">R$ ${(c.price*c.quantity).toFixed(2)}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
        <button class="btn small-btn outline" onclick="updateCartQty(${c.id},${c.quantity-1})">-</button>
        <span style="font-weight:700;font-size:13px">${c.quantity}</span>
        <button class="btn small-btn outline" onclick="updateCartQty(${c.id},${c.quantity+1})">+</button>
        <button style="border:none;background:none;color:var(--coral);font-size:11px;cursor:pointer;margin-left:auto" onclick="removeCartItem(${c.id})">Remover</button>
      </div></div>
    </div>`).join('')}
    ${cartItems.length>0?`<div style="background:var(--card);border-radius:12px;padding:12px;margin-top:8px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px"><span>Total:</span><span style="color:var(--green)">R$ ${cartItems.reduce((s,c)=>s+c.price*c.quantity,0).toFixed(2)}</span></div>
    <button class="btn" style="width:100%;margin-top:10px" onclick="renderCheckout()">Finalizar Compra</button></div>`:''}
  </div>`;

async function addToCart(productId) {
  try { await api('/api/cart',{method:'POST',body:JSON.stringify({productId,quantity:1})}); cartCount++; showToast('Adicionado ao carrinho!'); } catch(e) { alert(e.message); }
}

async function updateCartQty(id,qty) {
  if(qty<1){removeCartItem(id);return;}
  try { await api('/api/cart/'+id,{method:'PUT',body:JSON.stringify({quantity:qty})}); await loadCart(); renderCart(); } catch(e) {}
}

async function removeCartItem(id) {
  try { await api('/api/cart/'+id,{method:'DELETE'}); await loadCart(); renderCart(); } catch(e) {}
}

function renderCheckout() {
  screen.innerHTML = header('Finalizar Compra','')+`<div class="content">
    <div class="field"><label>Nome Completo</label><input id="shipName" value="${esc(currentUser?.name||'')}"></div>
    <div class="field"><label>Endereco</label><input id="shipAddress" placeholder="Rua, numero, bairro"></div>

      ${cartItems.map(c=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0"><span>${c.quantity}x ${esc(c.title)}</span><span>R$ ${(c.price*c.quantity).toFixed(2)}</span></div>`).join('')}

async function placeOrder(method) {
  const name=document.getElementById('shipName')?.value.trim();
  const address=document.getElementById('shipAddress')?.value.trim();
  const phone=document.getElementById('shipPhone')?.value.trim();
  if(!name||!address){alert('Preencha nome e endereco');return;}
  try {
    const data = await api('/api/orders',{method:'POST',body:JSON.stringify({shipping_name:name,shipping_address:address,shipping_phone:phone,payment_method:method})});
    await loadCart();
    alert('Pedido #'+data.orderId+' criado com sucesso!');
    renderMyOrders();
  } catch(e) { alert(e.message); }
}

function sendSticker(emoji) {
  if(!currentChatMatchId) return;
  sendWS({type:'chat_message',matchId:currentChatMatchId,text:emoji});
  api('/api/match/matches/'+currentChatMatchId+'/messages',{method:'POST',body:JSON.stringify({text:emoji})});
  const el=document.getElementById('chatMessages');
  if(el){el.innerHTML+=`<div class="chat-bubble sent" style="font-size:32px;padding:8px">${emoji}</div>`;el.scrollTop=el.scrollHeight;}
}

function sendLocation() {
  if(!navigator.geolocation) { alert('Geolocalizacao nao disponivel'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude, longitude} = pos.coords;
    const text = `[Localizacao] https://maps.google.com/?q=${latitude},${longitude}`;
    sendWS({type:'chat_message',matchId:currentChatMatchId,text});
    api('/api/match/matches/'+currentChatMatchId+'/messages',{method:'POST',body:JSON.stringify({text})});
    const el=document.getElementById('chatMessages');
    if(el){el.innerHTML+=`<div class="chat-bubble sent">&#128205; Localizacao compartilhada</div>`;el.scrollTop=el.scrollHeight;}
  }, () => alert('Nao foi possivel obter localizacao'));
}
